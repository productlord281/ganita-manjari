{t:"Shares, not totals",lv:"ANALYSE",w:"THE REPORTER",s:"My headline says Farm A grows the redder crop because it has more red apples. But the farms have different totals, and I do not want to be caught out. Which farm has the larger share of red apples?",tw:"PLANTED ERROR: one player says Farm A wins because 8 is more than 6. The team compares fractions.",tm:"Compared the fractions",m:{p:"Farm A: 8 red out of 13 apples. Farm B: 6 red out of 15 apples. Which farm has the larger share of red apples? 1) Farm A   2) Farm B. Type 1 or 2.",a:1,h:"Compare the fraction of apples that are red on each farm, not the counts."},t2:{c:"To compare groups of different sizes, compare shares (fractions or percentages), not raw counts.",f:"share = part / whole",e:"Team X wins 6 of 8 games (75%). Team Y wins 7 of 14 (50%). Team X has the better share even though Y has more wins.",q:{p:"Shop P sold 9 of the 12 phones it stocked. Shop Q sold 10 of the 20 it stocked. Which sold the larger share? 1) Shop P   2) Shop Q. Type 1 or 2.",a:1}},c:[8,8,3],ms:["Compared the fractions","Turned them into percentages","Guessed"],o:[["Riya","Compared the fractions","8/13 is about 0.62 and 6/15 is 0.4, so Farm A."],["Kabir","Turned them into percentages","8/13 is about 62% and 6/15 is 40%."]]},
{t:"The misleading chart",lv:"DECIDE",fg:"mis",w:"THE REPORTER",s:"Two papers print the same data, 52 sacks for Farm A and 55 for Farm B, but one chart makes the difference look huge. Which paper is stretching the truth?",tw:"SPLIT: each player studies one chart and the team compares scales.",tm:"Checked where each scale starts",m:{p:"The same data (52 and 55) is drawn two ways. Which chart makes the difference look much bigger than it is? 1) chart 1   2) chart 2. Type 1 or 2.",a:2,h:"Look at the number at the bottom of each chart's scale."},t2:{c:"A chart can mislead if its scale does not start at zero, because small differences look huge. Always check where the axis starts.",f:"check where the scale starts",e:"Bars of 52 and 55 on a scale that starts at 50 look like 2 against 5, more than twice as tall.",q:{p:"A bar chart's scale starts at 90 and shows bars of 92 and 96. What is misleading about it? 1) the bars are too colourful   2) the scale starts at 90 so small differences look huge. Type 1 or 2.",a:2}},c:[9,6,3],ms:["Checked where each scale starts","Compared the bar heights to the numbers","Guessed"],o:[["Meera","Checked where each scale starts","Chart 2 starts at 50, so the gap looks huge."],["Kabir","Compared the bar heights to the numbers","In chart 2 one bar looks more than twice the other, but 55 is hardly more than 52."]]},
{t:"A safe conclusion",lv:"DECIDE",w:"THE GRADUATE BEAR",s:"The Reporter says: everyone in the village earns 100 coins on average, so nobody is poor. But the four villagers earn 10, 10, 10 and 370. Which conclusion can I safely put on the final exam?",tw:"SPLIT: each player checks one conclusion against the numbers. The hero makes the final call.",tm:"Checked each conclusion against the numbers",m:{p:"Four villagers earn 10, 10, 10 and 370 coins, an average of 100. Which conclusion is safe? 1) nobody earns less than 50   2) everyone earns about 100   3) the four villagers earn 400 coins in total   4) the average person earns more than 100. Type 1, 2, 3 or 4.",a:3,h:"Check each conclusion against the actual numbers, not just the average."},t2:{c:"An average can hide big differences. Before drawing a conclusion, check it against the actual values, not just the average.",f:"an average does not show how spread out the values are",e:"Scores of 0, 0, 100 and 100 have a mean of 50, but nobody scored near 50.",q:{p:"Scores are 0, 0, 100 and 100 (mean 50). Which is safe? 1) everyone scored about 50   2) the total is 200   3) nobody scored 0. Type 1, 2 or 3.",a:2}},c:[8,9,3],ms:["Checked each conclusion against the numbers","Used the total from the average","Guessed"],o:[["Riya","Checked each conclusion against the numbers","Three villagers earn 10, so 1 and 2 are false. Only the total of 400 is certain."],["Kabir","Used the total from the average","100 × 4 = 400, so conclusion 3 holds."]]},
{t:"Create: data puzzle",lv:"CREATE",w:"THE GRADUATE BEAR",s:"You have passed the Archive's exam. One last thing: set a puzzle of your own for the next hero by choosing two class sizes.",tw:"SWAP: trade puzzles and work out each other's combined average.",cg:{labs:["students in A","students in B"],pf:"Choose the number of students in class A (average 80) and class B (average 60). The next hero must find the combined average. Add a clue and save.",ok:function(v){return v[0]>=1&&v[1]>=1&&v[0]%1===0&&v[1]%1===0},hint:"Use whole numbers of at least 1.",make:function(v){return"Class A has "+v[0]+" students averaging 80, and class B has "+v[1]+" students averaging 60. What is the combined average?"}}}];
var UL11=[
{t:"Follow the steps",lv:"NOTICE",fg:"flow7",b:["THE ROBOT WORKSHOP","Robots in the Kingdom of Machines do exactly what they are told, no more and no less. The dragon scrambled their instructions and they stand frozen. The Engineer says robots cannot guess, so every step must be exact."],w:"THE ENGINEER",s:"Robot 7 follows its list one step at a time. The list says: start with 7, add 3, multiply by 4, then subtract 6. The robot is waiting to show its final number. What will it show?",tw:"SPLIT: each player carries out one step and passes the number on.",m:{p:"Start with 7. Add 3, multiply by 4, then subtract 6. What number does the robot end with?",a:34,h:"Follow the steps in order, one at a time."},c:[12,4],ms:["Followed each step in order","Wrote it as one line of arithmetic"],o:[["Riya","Followed each step in order","7 + 3 = 10, 10 × 4 = 40, 40 − 6 = 34."],["Kabir","Wrote it as one line of arithmetic","(7 + 3) × 4 − 6 = 34."]]},
{t:"A vague order",lv:"UNDERSTAND",w:"THE ENGINEER",s:"Robot 7 froze when I gave it four orders. Three are exact, but one is so vague that no machine could do it. Which order froze the robot?",tw:"PLANTED ERROR: one player says all four orders are fine. The team tries to follow each one.",tm:"Checked which step is not exact",m:{p:"Which order is too vague for a robot? 1) Add 5 to the number   2) Make the number bigger   3) Subtract 2   4) Multiply by 3. Type 1, 2, 3 or 4.",a:2,h:"Could a machine follow the order without guessing?"},t2:{c:"An algorithm is a list of exact steps that always gives the answer. Every step must be so precise that a machine can follow it without guessing.",f:"algorithm = exact steps, in order, that always work",e:"Add 4 is exact. Make it a bit more is not, because a bit more is not a number.",q:{p:"Which order is exact? 1) Double the number   2) Do something with the number   3) Make it nicer   4) Change it a lot. Type 1, 2, 3 or 4.",a:1}},c:[10,6,3],ms:["Checked which step is not exact","Tried to follow each order","Guessed"],o:[["Meera","Checked which step is not exact","Make the number bigger does not say by how much."],["Kabir","Tried to follow each order","I could do 1, 3 and 4 with a number but not 2."]]},
{t:"The robot's secret rule",lv:"TRY",w:"THE MECHANIC",s:"Robot 9 has a secret rule that nobody remembers. Feed it a number and it shows its answer. You can try it four times. Tell me what it will show for 7.",tw:"SPLIT: each player runs the robot on a different number and the team shares the results.",tm:"Found a rule for even and for odd numbers",m:{probe:{f:function(x){return x%2===0?x/2:3*x+1},lab:"number in",tries:4,out:"robot shows",btn:"RUN",block:7},p:"Run the robot up to 4 times, work out its rule, then predict its answer for 7.",a:22,h:"Try both even and odd numbers. The robot treats them differently."},t2:{c:"A robot's rule can have different steps for different cases. Test several kinds of inputs, then write the rule so any input can be handled.",f:"if the input is even: halve it<br>if the input is odd: triple it and add 1",e:"Input 8 is even, so the output is 4. Input 5 is odd, so 3 × 5 + 1 = 16.",q:{p:"Using the same rule, what is the output for 11?",a:34}},c:[8,9,4],ms:["Found a rule for even and for odd numbers","Looked at the outputs one by one","Guessed"],o:[["Riya","Found a rule for even and for odd numbers","Even numbers are halved and odd ones go to 3 times plus 1, so 7 gives 22."],["Kabir","Looked at the outputs one by one","4 gave 2, 5 gave 16, 6 gave 3, and I worked out the pattern from those."]]},
{t:"Equal piles",lv:"UNDERSTAND",w:"THE MECHANIC",s:"I have 12 identical gears to pack into boxes, the same number in every box and none left over. How many different box sizes could I use, counting a box of 1 and a box of 12?",tw:"SPLIT: each player tests different box sizes and the team combines the list.",tm:"Paired up the divisors",m:{p:"12 gears are packed in equal piles with none left over. How many different pile sizes are possible?",a:6,h:"Pile sizes that fit are numbers that divide 12 exactly. Try every number from 1 up."},t2:{c:"A divisor of a number divides it exactly. Divisors come in pairs: if d divides n, then n ÷ d does too. Test numbers from 1 upwards and stop when the pairs meet.",f:"divisors come in pairs: d and n ÷ d",e:"20: 1 × 20, 2 × 10 and 4 × 5, so the divisors are 1, 2, 4, 5, 10, 20, six in all.",q:{p:"How many divisors does 30 have?",a:8}},c:[9,9,3],ms:["Paired up the divisors","Tested every number up to 12","Guessed"],o:[["Meera","Paired up the divisors","1 × 12, 2 × 6 and 3 × 4 give 1, 2, 3, 4, 6, 12: six sizes."],["Kabir","Tested every number up to 12","Checked 1 to 12 and 1, 2, 3, 4, 6, 12 all fit."]]},
{t:"The biggest shared piece",lv:"UNDERSTAND",w:"THE CLOCKMAKER",s:"Two gear wheels, one with 12 teeth and one with 18, are cut from bars of the same pattern. I want the largest block of teeth that fits both a whole number of times. How many teeth is it?",tw:"SPLIT: one player lists the divisors of 12 and another of 18.",tm:"Listed the divisors of both",m:{p:"What is the largest number that divides both 12 and 18?",a:6,h:"List the divisors of each number and look for the biggest one they share."},t2:{c:"The greatest common divisor (GCD) of two numbers is the largest number that divides both exactly. List the divisors of each and pick the biggest one they share.",f:"GCD(a, b) = the largest common divisor",e:"8 has divisors 1, 2, 4, 8 and 12 has 1, 2, 3, 4, 6, 12. The largest shared one is 4.",q:{p:"What is the GCD of 20 and 30?",a:10}},c:[9,8,3],ms:["Listed the divisors of both","Divided both by small numbers","Guessed"],o:[["Riya","Listed the divisors of both","12: 1, 2, 3, 4, 6, 12. 18: 1, 2, 3, 6, 9, 18. The biggest shared one is 6."],["Kabir","Divided both by small numbers","Both divide by 2 (6 and 9), then by 3 (2 and 3), so 2 × 3 = 6."]]},
{t:"Subtract and repeat",lv:"ANALYSE",w:"THE CLOCKMAKER",s:"Listing divisors takes forever for huge gears. The old robot has a shortcut: from the pair of numbers, replace the bigger one by the difference, and repeat until both numbers are equal. That number is the answer. Run it on 48 and 18.",tw:"SPLIT: each player carries out one step and passes the pair on.",tm:"Followed the subtraction steps",m:{p:"Start with the pair (48, 18). Replace the bigger number by the difference and repeat until both numbers are equal. What number do they become?",a:6,h:"48 − 18 = 30, so the pair is now (30, 18). Keep going."},t2:{c:"The GCD of two numbers does not change when you replace the larger by the difference. Repeat until both are equal, and that number is the GCD.",f:"GCD(a, b) = GCD(a − b, b)",e:"(20, 8) → (12, 8) → (4, 8) → (4, 4), so the GCD is 4.",q:{p:"Start with (35, 14) and keep replacing the bigger number by the difference. What number do they become?",a:7}},c:[8,8,3],ms:["Followed the subtraction steps","Spotted the GCD without all the steps","Guessed"],o:[["Meera","Followed the subtraction steps","(48,18) → (30,18) → (12,18) → (12,6) → (6,6)."],["Kabir","Spotted the GCD without all the steps","Both are multiples of 6 and 48 − 18 = 30 is too, so 6."]]},
{t:"Divide and keep the remainder",lv:"USE",w:"THE CLOCKMAKER",s:"Even faster is the old Indian trick: divide the bigger by the smaller and keep only the remainder, then repeat with the smaller number and the remainder, until the remainder is zero. The last number you divided by is the answer. Run it on 252 and 105.",tw:"SPLIT: each player does one division and passes the pair on.",tm:"Followed the divide and remainder steps",m:{p:"Start with 252 and 105. Divide, keep the remainder, and repeat with the divisor and the remainder until the remainder is 0. What is the last divisor?",a:21,h:"252 ÷ 105 leaves a remainder of 42. Now use 105 and 42."},t2:{c:"Dividing is a faster way to subtract many times. Replace the pair by the smaller number and the remainder, and repeat until the remainder is zero. The last divisor is the GCD.",f:"GCD(a, b) = GCD(b, remainder of a ÷ b)<br>stop when the remainder is 0",e:"(48, 18): 48 ÷ 18 leaves 12. (18, 12): leaves 6. (12, 6): leaves 0. The GCD is 6.",q:{p:"Use divide-and-remainder on 84 and 36. What is the GCD?",a:12}},c:[8,7,3],ms:["Followed the divide and remainder steps","Used repeated subtraction instead","Guessed"],o:[["Riya","Followed the divide and remainder steps","252 leaves 42, then 105 leaves 21, then 42 leaves 0. So 21."],["Kabir","Used repeated subtraction instead","Subtracted again and again and got to 21, but it took many more steps."]]},
{t:"Which robot is faster?",lv:"ANALYSE",w:"THE ENGINEER",s:"Two robots race to find the GCD of 1000 and 8. One subtracts again and again, the other divides and keeps the remainder. Which robot finishes in fewer steps?",tw:"PLANTED ERROR: one player says subtraction is always faster because it is simpler. The team counts the steps.",tm:"Counted the steps of each method",m:{p:"The robots must find the GCD of 1000 and 8. Which method needs fewer steps? 1) repeated subtraction   2) divide and keep the remainder   3) listing all divisors of 1000   4) all take the same number of steps. Type 1, 2, 3 or 4.",a:2,h:"Try each method on 1000 and 8. How many steps does each need?"},t2:{c:"Algorithms can solve the same problem in very different numbers of steps. Division skips many subtractions at once, so it is usually much faster on big numbers.",f:"better algorithm = fewer steps for the same answer",e:"GCD of 90 and 6: subtracting 6 fifteen times, or one division 90 ÷ 6 that leaves 0.",q:{p:"Which method finds the GCD of 600 and 5 in the fewest steps? 1) repeated subtraction   2) divide and keep the remainder   3) listing all divisors. Type 1, 2 or 3.",a:2}},c:[8,9,3],ms:["Counted the steps of each method","Reasoned that division skips many subtractions","Guessed"],o:[["Riya","Counted the steps of each method","Division: 1000 ÷ 8 leaves 0, one step. Subtraction needs over a hundred."],["Kabir","Reasoned that division skips many subtractions","Dividing does lots of subtractions in one go."]]},
{t:"Fix the robot",lv:"DECIDE",w:"THE ENGINEER",s:"I wrote a list to pick the larger of two numbers, A and B, but it keeps picking the wrong one. Step 1: take A and B. Step 2: if A is bigger than B, the answer is B. Step 3: otherwise the answer is A. Which step has the bug?",tw:"SPLIT: each player tests the list on a different pair of numbers. The hero makes the final call.",tm:"Tested the steps with two numbers",m:{p:"Which step has the bug? 1) Step 1   2) Step 2   3) Step 3. Type 1, 2 or 3.",a:2,h:"Try the list with A = 5 and B = 3. What answer does it give, and what should it be?"},t2:{c:"To debug an algorithm, run it on a small example and compare each step's result with what you expect. The first step that goes wrong is the bug.",f:"test with a small example<br>find the first wrong step",e:"Take A = 5 and B = 3. A is bigger, so the answer should be 5, but step 2 says B.",q:{p:"A robot adds two numbers: 1) take A and B   2) subtract B from A   3) show the result. Which step is the bug? Type 1, 2 or 3.",a:2}},c:[8,8,3],ms:["Tested the steps with two numbers","Read each step for common sense","Guessed"],o:[["Riya","Tested the steps with two numbers","A = 5, B = 3 gives B = 3 at step 2, but the larger is 5."],["Kabir","Read each step for common sense","If A is bigger, the answer should be A, not B."]]},
{t:"Create: robot rule",lv:"CREATE",w:"THE CHROME KEEPER",s:"The robots are marching again, thanks to you. One last thing: write a short robot rule for the next hero by choosing a number to add and a number to multiply by.",tw:"SWAP: trade rules and run each other's robots.",cg:{labs:["add","multiply by"],pf:"Make a robot rule: start with 5, add your first number, then multiply by your second. The next hero must work out what the robot ends with. Add a clue and save.",make:function(v){return"Start with 5. Add "+v[0]+", then multiply by "+v[1]+". What does the robot end with?"}}}];
var UL12=[
{t:"Sort the tiles",lv:"NOTICE",fg:"quads",b:["THE MOSAIC HALL","The dragon's fire cracked the great mosaic of the Flame Garden, and its tiles lie in heaps: squares, rectangles, kites and slanted shapes. The Mosaic Maker says a mosaic is only as good as the eye that tells one shape from another."],w:"THE MOSAIC MAKER",s:"Four loose tiles lie on the floor. I need the slanted one with two pairs of parallel sides that is not a rectangle, to start the border. Which tile is it?",tw:"SPLIT: each player checks one tile for parallel sides and the team compares.",tm:"Looked for two pairs of parallel sides",m:{p:"Which tile is a parallelogram that is not a rectangle? 1) tile 1   2) tile 2   3) tile 3   4) tile 4. Type 1, 2, 3 or 4.",a:3,h:"A parallelogram has both pairs of opposite sides parallel. Which tile is slanted like that?"},t2:{c:"A parallelogram is a four-sided shape with both pairs of opposite sides parallel. Rectangles and squares are special parallelograms, but a slanted one is not a rectangle.",f:"parallelogram = both pairs of opposite sides parallel",e:"A square is a parallelogram with four right angles and equal sides. A slanted frame is a parallelogram with no right angles.",q:{p:"Which of these is not a parallelogram? 1) square   2) rectangle   3) kite   4) rhombus. Type 1, 2, 3 or 4.",a:3}},c:[11,6,3],ms:["Looked for two pairs of parallel sides","Picked the slanted one","Guessed"],o:[["Riya","Looked for two pairs of parallel sides","Tile 3 has two pairs of parallel sides and no right angles."],["Kabir","Picked the slanted one","Tile 3 is the only slanted one with parallel sides."]]},
{t:"The hinged frame",lv:"TRY",w:"THE KITE MAKER",s:"My frame is a parallelogram with hinged corners. Feed it an angle for corner A and it reports the other corners. Try it three times, then tell me corner B when A is 70 degrees.",tw:"SPLIT: each player tilts the frame to a different angle and the team shares what it reports.",tm:"Saw that A and B add to 180°",m:{probe:{f:function(x){return"B = "+(180-x)+", C = "+x},lab:"angle A",tries:3,out:"frame reports",btn:"TILT",block:70},p:"Tilt the frame up to 3 times, watch corners B and C, then predict corner B when A is 70°.",a:110,h:"Compare A with B each time. What do they always add up to?"},t2:{c:"In a parallelogram, neighbouring angles add up to 180°, and opposite angles are equal.",f:"adjacent angles add to 180°<br>opposite angles are equal",e:"A = 50° gives B = 130°, C = 50° and D = 130°.",q:{p:"In a parallelogram, angle A is 65°. What is angle B?",a:115}},c:[9,8,3],ms:["Saw that A and B add to 180°","Noticed the pattern in the reports","Guessed"],o:[["Meera","Saw that A and B add to 180°","40 and 140, 100 and 80: always 180. So 70 gives 110."],["Kabir","Noticed the pattern in the reports","As A went up, B went down by the same amount."]]},
{t:"What is always true?",lv:"UNDERSTAND",w:"THE KITE MAKER",s:"Customers keep asking what is always true about my frames, however I tilt them. One of these four claims holds for every parallelogram. Which one?",tw:"PLANTED ERROR: one player insists all four sides are equal. The team finds a frame that breaks it.",tm:"Tested each claim on a squashed frame",m:{p:"Which statement is always true for a parallelogram? 1) all four sides are equal   2) opposite angles are equal   3) the diagonals are equal   4) all angles are 90°. Type 1, 2, 3 or 4.",a:2,h:"Picture a long, slanted parallelogram. Which claims break on it?"},t2:{c:"A claim is always true only if it holds for every parallelogram, including the long, slanted ones. A single counterexample, like a slanted frame with unequal sides, breaks a claim.",f:"always true = no counterexample",e:"All sides equal is false for a long, slanted frame with short and long sides.",q:{p:"Which is always true for a parallelogram? 1) opposite sides are equal   2) all angles are equal   3) the diagonals are perpendicular. Type 1, 2 or 3.",a:1}},c:[9,7,3],ms:["Tested each claim on a squashed frame","Remembered the properties","Guessed"],o:[["Riya","Tested each claim on a squashed frame","A long slanted frame has unequal sides, unequal diagonals and no right angles. Only opposite angles stay equal."],["Kabir","Remembered the properties","Opposite angles are equal in every parallelogram."]]},
{t:"Edging the garden",lv:"USE",w:"THE FLAME KEEPER",s:"The Flame Garden is a parallelogram ABCD with AB = 7 m and BC = 4 m. I need edging for its whole border. How many metres?",tw:"PLANTED ERROR: one player says 11 m because 7 + 4 = 11. The team checks the other two sides.",tm:"Used opposite sides equal",m:{p:"A parallelogram has AB = 7 m and BC = 4 m. How many metres of edging go all the way round?",a:22,h:"Opposite sides of a parallelogram are equal. How long are the other two sides?"},t2:{c:"Opposite sides of a parallelogram are equal, so two neighbouring sides tell you all four.",f:"opposite sides are equal<br>perimeter = 2(a + b)",e:"Sides 5 and 3: perimeter 2(5 + 3) = 16.",q:{p:"A parallelogram has sides 9 m and 6 m. What is its perimeter?",a:30}},c:[9,8,3],ms:["Used opposite sides equal","Added all four sides","Guessed"],o:[["Meera","Used opposite sides equal","CD = 7 and DA = 4, so 7 + 4 + 7 + 4 = 22."],["Kabir","Added all four sides","7 + 4 + 7 + 4 = 22."]]},
{t:"Is it a parallelogram?",lv:"ANALYSE",w:"THE MOSAIC MAKER",s:"A tile arrives with a note: two of its opposite sides are equal and parallel. Before I cut a whole floor from it, can I treat it as a parallelogram without measuring the rest?",tw:"PLANTED ERROR: one player says all four sides must be measured first. The team looks for a counterexample.",tm:"Knew one equal parallel pair is enough",m:{p:"A four-sided tile has one pair of opposite sides that are equal and parallel. Must it be a parallelogram? 1) Yes   2) No. Type 1 or 2.",a:1,h:"If two opposite sides are equal and parallel, what happens to the other two sides?"},t2:{c:"Any one of these tests proves a four-sided shape is a parallelogram: both pairs of opposite sides equal, one pair of opposite sides equal and parallel, or diagonals that cut each other in half.",f:"one pair equal and parallel ⇒ parallelogram<br>diagonals bisect each other ⇒ parallelogram",e:"A four-sided shape whose diagonals cross at their midpoints is a parallelogram.",q:{p:"A four-sided shape has diagonals that cut each other exactly in half. Must it be a parallelogram? 1) Yes   2) No. Type 1 or 2.",a:1}},c:[8,8,3],ms:["Knew one equal parallel pair is enough","Drew it and checked","Guessed"],o:[["Riya","Knew one equal parallel pair is enough","One pair equal and parallel is a test for a parallelogram."],["Kabir","Drew it and checked","Drew two equal parallel sides and joining the ends made a parallelogram."]]},
{t:"Half of the base",lv:"USE",fg:"trimid",b:["THE WIRE ARCH","Across the garden stands a triangular arch of wire over the flame beds. The Flame Keeper ties a rope between the midpoints of two of its sides, and wants to know how long the rope must be."],w:"THE FLAME KEEPER",s:"The arch is a triangle ABC with base BC = 12 m. I stretch a rope DE between the midpoints of the other two sides. How long is the rope?",tw:"SPLIT: one player measures BC and another places D and E at the midpoints.",tm:"Used the midpoint theorem",m:{p:"In triangle ABC, D and E are the midpoints of AB and AC, and BC = 12 m. How long is DE?",a:6,h:"The line joining two midpoints has a fixed relationship with the third side."},t2:{c:"The line joining the midpoints of two sides of a triangle is parallel to the third side and half as long.",f:"DE = ½ × BC<br>DE is parallel to BC",e:"If BC = 10 m, then DE = 5 m.",q:{p:"In a triangle, D and E are midpoints of two sides and BC = 18 m. How long is DE?",a:9}},c:[9,7,3],ms:["Used the midpoint theorem","Measured on a drawing","Guessed"],o:[["Meera","Used the midpoint theorem","DE is half of BC, so 6 m."],["Kabir","Measured on a drawing","Drew the triangle to scale and the rope came to half the base."]]},
{t:"Join the midpoints",lv:"USE",fg:"varig",w:"THE MOSAIC MAKER",s:"A four-sided plot has diagonals of 10 m and 14 m. A path joins the midpoints of its four sides and makes a new shape inside. How long is the path all the way round?",tw:"SPLIT: each player works out two sides of the inner shape and the team adds them.",tm:"Used the midpoint theorem on each triangle",m:{p:"The diagonals of a four-sided plot are 10 m and 14 m. A path joins the midpoints of its four sides. How long is the path all the way round?",a:24,h:"Each side of the inner shape is half of one diagonal."},t2:{c:"Joining the midpoints of the sides of any quadrilateral makes a parallelogram. Each of its sides is half of a diagonal of the original shape and parallel to it.",f:"inner sides = ½ × diagonals<br>perimeter = diagonal 1 + diagonal 2",e:"Diagonals 6 and 8: inner sides 3 and 4, so the perimeter is 2 × (3 + 4) = 14.",q:{p:"The diagonals of a quadrilateral are 12 m and 20 m. What is the perimeter of the shape formed by joining the midpoints of its sides?",a:32}},c:[8,7,3],ms:["Used the midpoint theorem on each triangle","Added the two diagonals","Guessed"],o:[["Riya","Used the midpoint theorem on each triangle","Two sides are 5 m and two are 7 m, so 5 + 7 + 5 + 7 = 24."],["Kabir","Added the two diagonals","The perimeter equals the sum of the diagonals: 10 + 14 = 24."]]},
{t:"Where the medians meet",lv:"ANALYSE",fg:"cent",w:"THE FLAME KEEPER",s:"The three ropes from each corner of the arch to the midpoint of the opposite side meet at one point, G, where the lamp must hang. The rope AD is 9 m long. How far from A does the lamp hang?",tw:"PLANTED ERROR: one player says G is exactly halfway, 4.5 m. The team checks the 2 : 1 split.",tm:"Used the 2:1 split",m:{p:"The medians of a triangle meet at G. Median AD is 9 m long. How far is G from A?",a:6,h:"G splits every median in the same fixed ratio, with the longer part nearer the corner."},t2:{c:"The three medians of a triangle meet at one point called the centroid. It divides each median in the ratio 2 : 1, with the longer part nearer the corner.",f:"AG = ⅔ × AD<br>GD = ⅓ × AD",e:"A median 12 m long: AG = 8 m and GD = 4 m.",q:{p:"A median is 15 m long. How far is the centroid from the corner it starts at?",a:10}},c:[8,6,3],ms:["Used the 2:1 split","Measured on a drawing","Guessed"],o:[["Meera","Used the 2:1 split","AG is two thirds of 9, which is 6."],["Kabir","Measured on a drawing","Drew the medians and G sat two thirds of the way down."]]},
{t:"Will the floor tile?",lv:"DECIDE",w:"THE MOSAIC MAKER",s:"The new floor must be covered with copies of one shape, with no gaps and no overlaps. The stone-cutter offers four shapes. Which one can always cover the floor?",tw:"SPLIT: each player tests one shape by sketching copies around a point. The hero makes the final call.",tm:"Used the four angles add to 360°",m:{p:"Which shape can always cover a floor with no gaps? 1) a regular pentagon   2) any four-sided shape   3) a regular octagon   4) a circle. Type 1, 2, 3 or 4.",a:2,h:"Think about the angles that meet at one corner of the floor."},t2:{c:"The four angles of any quadrilateral add up to 360°, which is exactly the angle around a point. So four copies, turned suitably, fit together around each corner with no gap.",f:"angles of a quadrilateral add to 360°<br>angles around a point add to 360°",e:"A triangle's angles add to 180°, so six copies fit around a point.",q:{p:"Which shape always tiles a floor? 1) any triangle   2) a regular pentagon   3) a circle. Type 1, 2 or 3.",a:1}},c:[8,7,3],ms:["Used the four angles add to 360°","Tried sketching the shapes","Guessed"],o:[["Riya","Used the four angles add to 360°","A quadrilateral's angles add to 360°, and 360° is a full turn around a point."],["Kabir","Tried sketching the shapes","Pentagons and octagons left gaps, circles left gaps, and any quadrilateral fitted."]]},
{t:"Create: tile puzzle",lv:"CREATE",w:"THE FLAME KEEPER",s:"The garden is alight again, thanks to you. One last thing: design a parallelogram tile for the next hero by choosing its first angle.",tw:"SWAP: trade tiles and find each other's other three angles.",cg:{labs:["angle A"],pf:"Make a parallelogram tile: choose angle A in degrees (between 1 and 179). The next hero must find the other three angles. Add a clue and save.",ok:function(v){return v[0]>0&&v[0]<180},hint:"Choose a number between 1 and 179.",make:function(v){return"A parallelogram has angle A = "+v[0]+" degrees. Find the other three angles."}}}];
var UL13=[
{t:"Which pair fits?",lv:"NOTICE",b:["THE THORN ROADS","The roads of the Kingdom of Crossroads are marked by signs that give two numbers each, a place along and a place up. Thorns have grown over most of them. The Warden says a sign is true only if its two numbers fit its equation."],w:"THE ROAD WARDEN",s:"A signpost says that the two numbers add up to 10. Four travellers each show me a pair of numbers, and only one pair fits the sign. Which one?",tw:"SPLIT: each player tests one pair against the sign and the team compares.",tm:"Added each pair",m:{p:"The sign says x + y = 10. Which pair fits? 1) (3, 6)   2) (4, 6)   3) (7, 4)   4) (5, 6). Type 1, 2, 3 or 4.",a:2,h:"Add the two numbers in each pair. Which one makes 10?"},t2:{c:"A solution of an equation in two variables is a pair of numbers that makes the equation true when you put them in for x and y.",f:"(x, y) is a solution if the equation holds",e:"For x + y = 8, the pair (3, 5) works because 3 + 5 = 8.",q:{p:"For x + y = 12, which pair works? 1) (5, 6)   2) (7, 5)   3) (8, 5). Type 1, 2 or 3.",a:2}},c:[11,5,3],ms:["Added each pair","Spotted the pair that adds to 10","Guessed"],o:[["Riya","Added each pair","3 + 6 = 9, 4 + 6 = 10, 7 + 4 = 11, 5 + 6 = 11. Only the second works."],["Kabir","Spotted the pair that adds to 10","4 + 6 is 10 straight away."]]},
{t:"Feed the signpost",lv:"TRY",w:"THE ROAD WARDEN",s:"This sign says 2x + y = 8. Feed it a value for x and it tells you the y that goes with it. You have three tries. Tell me the y that goes with x = 3.",tw:"SPLIT: each player feeds a different x and the team shares the answers before predicting.",tm:"Spotted that y drops by 2 each time",m:{probe:{f:function(x){return"y = "+(8-2*x)},lab:"x",tries:3,out:"the sign says",btn:"TRY",block:3},p:"Feed up to 3 values of x and watch the y that goes with each. Then predict y when x = 3.",a:2,h:"Compare the y values for x = 0, 1 and 2. How much does y change each time x goes up by 1?"},t2:{c:"For 2x + y = 8 you can rearrange to y = 8 − 2x. Then each x gives exactly one y.",f:"2x + y = 8<br>y = 8 − 2x",e:"For 3x + y = 10: when x = 2, y = 10 − 6 = 4.",q:{p:"For 3x + y = 10, what is y when x = 1?",a:7}},c:[8,9,3],ms:["Spotted that y drops by 2 each time","Rearranged the equation to find y","Guessed"],o:[["Meera","Spotted that y drops by 2 each time","x = 0 gave 8, x = 1 gave 6, x = 2 gave 4, so x = 3 gives 2."],["Kabir","Rearranged the equation to find y","y = 8 − 2x, so x = 3 gives 8 − 6 = 2."]]},
{t:"How many solutions?",lv:"UNDERSTAND",w:"THE PEDLAR",s:"I found a pair of numbers for the sign x + y = 10 and I say it is the only one. The Warden says there are far more. Who is right, and how many are there?",tw:"PLANTED ERROR: one player backs the Pedlar. The team finds three more pairs.",tm:"Saw that every x gives a y",m:{p:"How many pairs (x, y) satisfy x + y = 10? 1) only one   2) exactly two   3) exactly ten   4) infinitely many. Type 1, 2, 3 or 4.",a:4,h:"Pick any x you like. Is there always a y to go with it?"},t2:{c:"One equation with two unknowns has infinitely many solutions: choose any x and there is a y to match. The solutions form a straight line when you plot them.",f:"one equation, two unknowns: infinitely many solutions<br>the solutions lie on a straight line",e:"x + y = 4: (0, 4), (1, 3), (2, 2), (−1, 5) and many more.",q:{p:"For y = 2x, how many pairs (x, y) work? 1) one   2) two   3) infinitely many. Type 1, 2 or 3.",a:3}},c:[9,6,3],ms:["Saw that every x gives a y","Listed some pairs","Guessed"],o:[["Riya","Saw that every x gives a y","Choose any x and y = 10 − x always works, so there are infinitely many."],["Kabir","Listed some pairs","(1, 9), (2, 8), (3, 7), (0.5, 9.5) and so on without end."]]},
{t:"Mark the road",lv:"USE",w:"THE ROAD WARDEN",s:"The road for the sign 2x + y = 3 passes through many points, but only a few are on my map. Mark three of them for the surveyors: the point where x = 0, then where x = 1, then where x = −1.",tw:"SPLIT: each player works out the y for one x and the team plots all three.",tm:"Worked out y for each x",m:{g:{T:[[0,3],[1,1],[-1,5]],nm:["A","B","C"],q:["Tap the point on 2x + y = 3 where x = 0.","Tap the point on 2x + y = 3 where x = 1.","Tap the point on 2x + y = 3 where x = −1."]},h:"Put x into 2x + y = 3 and work out y, then tap (x, y)."},t2:{c:"To plot an equation, choose an x, work out the y that goes with it, and mark (x, y). Three points show the whole line.",f:"choose x, find y, plot (x, y)",e:"x + y = 4 with x = 1 gives y = 3, so mark (1, 3).",q:{p:"For x + y = 6, what is y when x = 4?",a:2}},c:[10,7,3],ms:["Worked out y for each x","Counted along the line","Guessed"],o:[["Meera","Worked out y for each x","x = 0 gives y = 3, x = 1 gives y = 1, x = −1 gives y = 5."],["Kabir","Counted along the line","From (0, 3) each step right drops y by 2."]]},
{t:"Where the road meets the axis",lv:"UNDERSTAND",w:"THE MERCHANT",s:"My trade road follows x + y = 4. I want a toll post exactly where it crosses the east-west road, the x-axis, where y is zero. How far east of the origin does the toll post stand?",tw:"PLANTED ERROR: one player says x = 0 on the x-axis. The team checks which variable is zero.",tm:"Put y = 0 in the equation",m:{p:"The road x + y = 4 crosses the x-axis, where y = 0. What is x there?",a:4,h:"On the x-axis, y is 0. Put y = 0 into the equation."},t2:{c:"A point on the x-axis has y = 0, and a point on the y-axis has x = 0. To find where a line crosses an axis, put 0 in for the other variable.",f:"crosses the x-axis: y = 0<br>crosses the y-axis: x = 0",e:"x + 2y = 6 crosses the x-axis where y = 0, so x = 6.",q:{p:"Where does x + 2y = 6 cross the y-axis? (Put x = 0.) Enter y.",a:3}},c:[9,7,3],ms:["Put y = 0 in the equation","Used a graph","Guessed"],o:[["Riya","Put y = 0 in the equation","x + 0 = 4, so x = 4."],["Kabir","Used a graph","Plotted the road and read where it hit the x-axis."]]},
{t:"Where two roads meet",lv:"ANALYSE",w:"THE ROAD WARDEN",s:"Two roads cross at the great crossing: x + y = 6 (the blue road) and x − y = 2 (the pink road). The Thorn King stands exactly where they meet. Tap that spot.",tw:"SPLIT: one player follows the blue road and another the pink road, and they agree where they meet.",tm:"Read the crossing from the two lines",m:{g:{T:[[4,2]],nm:["K"],lines:[[1,5,5,1],[0,-2,5,3]],q:["Tap the point where the two roads cross."]},h:"Find the spot that is on both roads."},t2:{c:"The solution of two equations together is the point that lies on both lines. On a graph it is where the lines cross.",f:"solution of a pair = the crossing point",e:"x + y = 4 and x − y = 2 cross at (3, 1), because 3 + 1 = 4 and 3 − 1 = 2.",q:{p:"The lines x + y = 5 and x − y = 1 cross at which point? 1) (2, 3)   2) (3, 2)   3) (4, 1). Type 1, 2 or 3.",a:2}},c:[10,7,3],ms:["Read the crossing from the two lines","Tried points on both roads","Guessed"],o:[["Meera","Read the crossing from the two lines","The roads cross at (4, 2): 4 + 2 = 6 and 4 − 2 = 2."],["Kabir","Tried points on both roads","Checked points on the blue road until one also fit the pink one."]]},
{t:"Swap it in",lv:"USE",w:"THE MERCHANT",s:"Two prices are tied together: the two goods cost 10 coins together, and one costs 2 less than three times the other: y = 3x − 2. A single swap solves it. What is x?",tw:"SPLIT: one player makes the swap and another solves for x.",tm:"Put 3x − 2 in place of y",m:{p:"x + y = 10 and y = 3x − 2. What is x?",a:3,h:"Put 3x − 2 in place of y in the first equation. Then solve for x."},t2:{c:"When one equation tells you what y equals, put that in place of y in the other equation. You are left with one unknown.",f:"put the expression for y into the other equation<br>solve for x, then find y",e:"x + y = 7 and y = 2x + 1: x + 2x + 1 = 7, so 3x = 6 and x = 2.",q:{p:"x + y = 9 and y = 2x. What is x?",a:3}},c:[9,8,3],ms:["Put 3x − 2 in place of y","Tried values for x","Guessed"],o:[["Riya","Put 3x − 2 in place of y","x + 3x − 2 = 10, so 4x = 12 and x = 3."],["Kabir","Tried values for x","Tried x = 2, then x = 3: 3 + 7 = 10."]]},
{t:"Add the roads",lv:"USE",w:"THE PEDLAR",s:"My two crates satisfy x + y = 12 and x − y = 4. If I add the two statements, the y's disappear. What is x?",tw:"SPLIT: one player adds the left sides and another the right sides.",tm:"Added the two equations",m:{p:"x + y = 12 and x − y = 4. Add the equations to get rid of y. What is x?",a:8,h:"Adding x + y and x − y leaves 2x. What do the right sides add to?"},t2:{c:"When the y terms are opposites, adding the two equations removes y. Solve what is left for x, then put x back to find y.",f:"add the equations to cancel y<br>solve for x, then find y",e:"x + y = 10 and x − y = 2: adding gives 2x = 12, so x = 6 and y = 4.",q:{p:"x + y = 14 and x − y = 6. What is x?",a:10}},c:[9,7,3],ms:["Added the two equations","Used a swap instead","Guessed"],o:[["Meera","Added the two equations","2x = 16, so x = 8."],["Kabir","Used a swap instead","y = 12 − x, so x − (12 − x) = 4 gives 2x = 16, so x = 8."]]},
{t:"Two plans",lv:"ANALYSE",w:"THE MERCHANT",s:"Two carriers charge for a trip. Carrier A takes 50 coins plus 10 for every kilometre, and carrier B takes 20 coins plus 20 for every kilometre. At how many kilometres do they cost the same?",tw:"SPLIT: each player works out one carrier's price for several distances and the team compares.",tm:"Set the two costs equal",m:{p:"Carrier A charges 50 + 10x and carrier B charges 20 + 20x for x km. At how many km do they cost the same?",a:3,h:"Set the two prices equal and solve for x."},t2:{c:"To find where two rules give the same result, set them equal and solve. The answer is the x where the two lines on a graph cross.",f:"set rule 1 = rule 2<br>solve for x",e:"Plan P: 10 + 5x. Plan Q: 20 + 3x. 10 + 5x = 20 + 3x gives 2x = 10, so x = 5.",q:{p:"Plan P costs 30 + 5x and plan Q costs 10 + 15x. At what x do they cost the same?",a:2}},c:[8,9,3],ms:["Set the two costs equal","Made a table of both costs","Guessed"],o:[["Riya","Set the two costs equal","50 + 10x = 20 + 20x, so 30 = 10x and x = 3."],["Kabir","Made a table of both costs","At 1 km: 60 and 40. At 2 km: 70 and 60. At 3 km: 80 and 80."]]},
{t:"Do they ever meet?",lv:"DECIDE",w:"THE ROAD WARDEN",s:"A surveyor claims two roads, 2x + 2y = 6 and x + y = 5, meet at the old oak. I think they run side by side and never meet. Who is right?",tw:"PLANTED ERROR: one player backs the surveyor. The team simplifies the first equation. The hero makes the final call.",tm:"Simplified the first equation",m:{p:"Do the roads 2x + 2y = 6 and x + y = 5 ever meet? 1) yes, at (1, 2)   2) never, they are parallel   3) yes, at (2, 1)   4) they are the same road. Type 1, 2, 3 or 4.",a:2,h:"Divide the first equation by 2. What do the two roads say about x + y?"},t2:{c:"If two equations say different things about the same expression, such as x + y = 3 and x + y = 5, no pair can satisfy both. The roads are parallel and never meet.",f:"same left side, different right side: parallel, no solution",e:"x + y = 2 and 2x + 2y = 8 give x + y = 2 and x + y = 4: never both true, so they are parallel.",q:{p:"Do the roads x + y = 4 and 3x + 3y = 15 ever meet? 1) yes   2) never. Type 1 or 2.",a:2}},c:[8,8,3],ms:["Simplified the first equation","Tried to find a shared point","Guessed"],o:[["Riya","Simplified the first equation","2x + 2y = 6 is x + y = 3, but the other says x + y = 5. They can never both be true."],["Kabir","Tried to find a shared point","(1, 2) gives 3 for the second, (2, 1) also gives 3, not 5."]]},
{t:"Create: crossroads",lv:"CREATE",w:"THE THORN KING",s:"The thorns have parted, thanks to you. One last thing: set two crossing roads for the next hero by choosing the point where they meet.",tw:"SWAP: trade crossroads and find each other's meeting point.",cg:{labs:["x","y"],pf:"Choose the crossing point (x, y), whole numbers. The game writes two roads, x + y and x − y, through it. The next hero must find where they cross. Add a clue and save.",ok:function(v){return v[0]%1===0&&v[1]%1===0},hint:"Use whole numbers.",make:function(v){return"Two roads: x + y = "+(v[0]+v[1])+" and x − y = "+(v[0]-v[1])+". Where do they cross?"}}}];
var UL14=[
{t:"Count the blocks",lv:"NOTICE",fg:"cub432",b:["THE GREAT FORGE","The Kingdom of Forges lights the world with one great forge, now cold. The Forge Master says that to make the Sword he must first know how much metal each mould will hold, and how much of it must be polished."],w:"THE FORGE MASTER",s:"My smallest mould is a box 4 cubes long, 3 cubes wide and 2 cubes high, and each cube holds one scoop of metal. How many scoops fill the box?",tw:"SPLIT: each player counts one layer and the team adds the layers.",m:{p:"A mould is 4 cubes long, 3 wide and 2 high. How many unit cubes fill it?",a:24,h:"Count the cubes in one layer, then see how many layers there are."},c:[12,4],ms:["Multiplied the three sizes","Counted layer by layer"],o:[["Riya","Multiplied the three sizes","4 × 3 × 2 = 24."],["Kabir","Counted layer by layer","One layer has 12 cubes and there are 2 layers: 24."]]},
{t:"Volume of a crate",lv:"USE",fg:"cub543",w:"THE FORGE MASTER",s:"A bigger crate for the ingots is 5 m long, 4 m wide and 3 m high. I cannot count cubes one by one. How many cubic metres of ingots does it hold?",tw:"PLANTED ERROR: one player adds 5 + 4 + 3 and says 12. The team checks what a cubic metre means.",tm:"Used length × breadth × height",m:{p:"A crate is 5 m by 4 m by 3 m. What is its volume in cubic metres?",a:60,h:"Think of one layer of cubes, then stack the layers."},t2:{c:"The volume of a cuboid is the number of unit cubes that fit inside: the cubes in one layer times the number of layers.",f:"volume = length × breadth × height",e:"A box 6 m by 2 m by 4 m: 6 × 2 × 4 = 48 cubic metres.",q:{p:"A tank is 8 m long, 5 m wide and 2 m high. What is its volume?",a:80}},c:[10,6,3],ms:["Used length × breadth × height","Counted layer by layer","Guessed"],o:[["Meera","Used length × breadth × height","5 × 4 × 3 = 60."],["Kabir","Counted layer by layer","One layer is 20 cubes and there are 3 layers: 60."]]},
{t:"Paint or fill?",lv:"UNDERSTAND",w:"THE FORGE MASTER",s:"The crate must be painted on the outside so it does not rust, and later filled with ingots. Which measure tells me how much paint I need?",tw:"PLANTED ERROR: one player says volume. The team asks which measure covers the outside.",tm:"Matched paint to the outside surface",m:{p:"Which measure tells how much paint covers the outside of the crate? 1) volume   2) surface area   3) length   4) weight. Type 1, 2, 3 or 4.",a:2,h:"Paint covers the outside. Is that the space inside, or the area outside?"},t2:{c:"Surface area is the total area of all the outside faces of a solid, measured in square units. Volume is the space inside, measured in cubic units.",f:"surface area: outside (square units)<br>volume: inside (cubic units)",e:"Painting a box needs surface area. Filling a box with water needs volume.",q:{p:"Which measure tells how much water a tank holds? 1) volume   2) surface area. Type 1 or 2.",a:1}},c:[10,6,3],ms:["Matched paint to the outside surface","Pictured painting the faces","Guessed"],o:[["Riya","Matched paint to the outside surface","Paint covers the outside, which is area, so surface area."],["Kabir","Pictured painting the faces","I imagined brushing every face of the crate, which is the surface."]]},
{t:"Paint the crate",lv:"USE",fg:"cub543",w:"THE FORGE MASTER",s:"Now the paint. The crate is 5 m by 4 m by 3 m and I must cover all six faces. How many square metres of paint do I need?",tw:"SPLIT: each player works out one pair of faces and the team adds them.",tm:"Used 2(lb + bh + hl)",m:{p:"A crate is 5 m by 4 m by 3 m. What is the total area of all six faces in square metres?",a:94,h:"Find the area of each pair of matching faces and add them."},t2:{c:"A cuboid has three pairs of matching faces. Add the areas of the three different faces and double the total.",f:"surface area = 2(lb + bh + hl)",e:"A box 2 by 3 by 4: 2(6 + 12 + 8) = 52.",q:{p:"A box is 6 m by 2 m by 3 m. What is its total surface area?",a:72}},c:[9,8,3],ms:["Used 2(lb + bh + hl)","Added the six faces one by one","Guessed"],o:[["Riya","Used 2(lb + bh + hl)","2(20 + 12 + 15) = 2 × 47 = 94."],["Kabir","Added the six faces one by one","20 + 20 + 12 + 12 + 15 + 15 = 94."]]},
{t:"Feed the forge",lv:"TRY",w:"THE BLACKSMITH",s:"My cube-shaped moulds come in many sizes. Feed the forge a side length and it tells you the volume and the surface area. Try three sizes, then tell me the surface area of a cube with side 10.",tw:"SPLIT: each player casts a different cube and the team shares what the forge says.",tm:"Saw that surface area is 6 times the side squared",m:{probe:{f:function(x){return"volume "+x*x*x+", surface "+6*x*x},lab:"side",tries:3,out:"forge says",btn:"CAST",block:10},p:"Cast up to 3 cubes and watch the volume and surface area. Then predict the surface area of a cube with side 10.",a:600,h:"Compare the surface areas for sides 1, 2 and 3. How does the surface area grow with the side?"},t2:{c:"A cube has six identical square faces, so its surface area is six times the area of one face. Its volume is the side multiplied by itself three times.",f:"cube: surface area = 6 × side²<br>volume = side³",e:"A cube with side 4: surface area 6 × 16 = 96, volume 64.",q:{p:"A cube has side 5. What is its surface area?",a:150}},c:[8,9,3],ms:["Saw that surface area is 6 times the side squared","Noticed the numbers from the forge","Guessed"],o:[["Meera","Saw that surface area is 6 times the side squared","Side 1 gave 6, side 2 gave 24, side 3 gave 54: 6 × side × side. So 600."],["Kabir","Noticed the numbers from the forge","6, 24, 54 are 6 × 1, 6 × 4, 6 × 9, so side 10 gives 6 × 100."]]},
{t:"The round barrel",lv:"USE",fg:"cyl",w:"THE BLACKSMITH",s:"A barrel of molten metal is a cylinder with radius 7 m and height 10 m. The crown-maker needs to know how much it holds. Use 22/7 for π.",tw:"SPLIT: one player finds the area of the base and another multiplies by the height.",tm:"Used πr²h",m:{p:"A cylinder has radius 7 m and height 10 m. What is its volume in cubic metres? Use π = 22/7.",a:1540,h:"The base is a circle. Find its area, then stack it up to the full height."},t2:{c:"A cylinder is a stack of circles, so its volume is the area of the base circle times the height.",f:"volume of a cylinder = πr²h",e:"r = 7, h = 3: 22/7 × 7 × 7 × 3 = 462.",q:{p:"A cylinder has radius 14 m and height 5 m. What is its volume? Use π = 22/7.",a:3080}},c:[8,8,3],ms:["Used πr²h","Found the base area then multiplied","Guessed"],o:[["Riya","Used πr²h","22/7 × 7 × 7 × 10 = 1540."],["Kabir","Found the base area then multiplied","Base: 22/7 × 49 = 154. Then 154 × 10 = 1540."]]},
{t:"The pouring cone",lv:"USE",fg:"cone",w:"THE BLACKSMITH",s:"The funnel above the barrel is a cone with the same radius, 7 m, and a height of 6 m. How much metal does it hold? Use 22/7 for π.",tw:"PLANTED ERROR: one player says the cone holds the same as a cylinder. The team finds the factor.",tm:"Used ⅓πr²h",m:{p:"A cone has radius 7 m and height 6 m. What is its volume in cubic metres? Use π = 22/7.",a:308,h:"A cone holds a fixed fraction of the cylinder with the same base and height."},t2:{c:"A cone holds exactly one third of the cylinder with the same base and height.",f:"volume of a cone = ⅓ × πr²h",e:"r = 3, h = 7: ⅓ × 22/7 × 9 × 7 = 66.",q:{p:"A cone has radius 3 m and height 14 m. What is its volume? Use π = 22/7.",a:132}},c:[8,8,3],ms:["Used ⅓πr²h","Took a third of the matching cylinder","Guessed"],o:[["Meera","Used ⅓πr²h","⅓ × 22/7 × 49 × 6 = 308."],["Kabir","Took a third of the matching cylinder","The cylinder holds 22/7 × 49 × 6 = 924, and a third is 308."]]},
{t:"The round shield",lv:"USE",fg:"sph",w:"THE BLACKSMITH",s:"The Sword's shield is a perfect sphere with a radius of 7 cm, and it must be covered in gold leaf. How many square centimetres of leaf? Use 22/7 for π.",tw:"SPLIT: one player works out πr² and another multiplies by the right factor.",tm:"Used 4πr²",m:{p:"A sphere has radius 7 cm. What is its surface area in square centimetres? Use π = 22/7.",a:616,h:"A sphere's surface is a fixed multiple of the area of a circle with the same radius."},t2:{c:"A sphere's surface area is exactly four times the area of a circle with the same radius.",f:"surface area of a sphere = 4πr²",e:"r = 14: 4 × 22/7 × 196 = 2464.",q:{p:"A sphere has radius 3.5 cm. What is its surface area? Use π = 22/7.",a:154}},c:[8,7,3],ms:["Used 4πr²","Took four circles of the same radius","Guessed"],o:[["Riya","Used 4πr²","4 × 22/7 × 49 = 616."],["Kabir","Took four circles of the same radius","One circle is 154, and four of them make 616."]]},
{t:"Unroll the barrel",lv:"ANALYSE",w:"THE FORGE MASTER",s:"To make the barrel's curved wall, I unroll it into one flat sheet of metal. The sheet is as tall as the barrel and as long as the distance around it. How many square metres of sheet for a barrel with radius 7 m and height 10 m? Use π = 22/7.",tw:"SPLIT: one player works out the length of the sheet and another the height.",tm:"Unrolled it into a rectangle",m:{p:"The curved wall of a cylinder with radius 7 m and height 10 m is unrolled flat. What is its area in square metres? Use π = 22/7.",a:440,h:"Unrolled, the wall is a rectangle. One side is the height. What is the other side?"},t2:{c:"The curved side of a cylinder unrolls into a rectangle. Its length is the circumference of the base, 2πr, and its width is the height h.",f:"curved surface area = 2πr × h",e:"r = 7, h = 3: 2 × 22/7 × 7 × 3 = 132.",q:{p:"A cylinder has radius 14 m and height 3 m. What is the area of its curved wall? Use π = 22/7.",a:264}},c:[8,7,3],ms:["Unrolled it into a rectangle","Used the formula for curved surface","Guessed"],o:[["Meera","Unrolled it into a rectangle","The length is the circumference 2 × 22/7 × 7 = 44 and the width is 10, so 440."],["Kabir","Used the formula for curved surface","2πrh = 2 × 22/7 × 7 × 10 = 440."]]},
{t:"Least metal",lv:"DECIDE",w:"THE FORGE MASTER",s:"Four crates all hold exactly 1000 cubic centimetres of ingots, but they use different amounts of metal for their walls. The cheapest one has the smallest surface area. Which crate should I order?",tw:"SPLIT: each player works out the surface area of one crate. The hero makes the final call.",tm:"Worked out each surface area",m:{p:"All four boxes hold 1000 cm³. Which box needs the least metal for its walls? 1) 10 × 10 × 10   2) 20 × 10 × 5   3) 25 × 20 × 2   4) 100 × 10 × 1. Type 1, 2, 3 or 4.",a:1,h:"Work out the surface area of each box, using 2(lb + bh + hl)."},t2:{c:"For a fixed volume, the more cube-like a box is, the smaller its surface area, so the less material it needs.",f:"same volume: the cube has the least surface area",e:"Volume 64: a 4 × 4 × 4 cube has surface area 96. An 8 × 8 × 1 slab has 160.",q:{p:"All boxes hold 216 cm³. Which uses the least metal? 1) 6 × 6 × 6   2) 12 × 9 × 2   3) 27 × 8 × 1. Type 1, 2 or 3.",a:1}},c:[8,9,3],ms:["Worked out each surface area","Picked the most cube-like box","Guessed"],o:[["Riya","Worked out each surface area","600, 700, 1180 and 2220. The cube is the smallest."],["Kabir","Picked the most cube-like box","Cubes hold the most for the least wall, so 10 × 10 × 10."]]},
{t:"Create: crate puzzle",lv:"CREATE",w:"THE FORGE MASTER",s:"The Sword is forged, thanks to you. One last thing: design a crate for the next hero by choosing its three sizes.",tw:"SWAP: trade crates and work out each other's volume and surface area.",cg:{labs:["length","breadth","height"],pf:"Design a crate: choose its length, breadth and height in metres. The next hero must find its volume and the paint needed. Add a clue and save.",ok:function(v){return v[0]>0&&v[1]>0&&v[2]>0},hint:"All three sizes must be bigger than 0.",make:function(v){return"A crate is "+v[0]+" m by "+v[1]+" m by "+v[2]+" m. Find its volume and the area of paint needed."}}}];

 function LT(code,h){var bc=null,P={},me=null,kM="gm:m:"+code,kP="gm:p:"+code,kC="gm:c:"+code,kS="gm:s:"+code;

 function FT(code,h){var r=fb.ref("rooms/"+code),me=null,mr=r.child("online/"+TAB),un=[],dc=0;
