{t:"Parts of a circle",lv:"UNDERSTAND",fg:"fc1",w:"THE POTTER",s:"The plaza cracked straight through the middle, and the crack runs through the centre and is 26 m long. To restart the pattern I must lay a rope from the centre to the edge. How long must my rope be?",tw:"SPLIT: one player knows only that the chord passes through the centre, another only its length. PLANTED ERROR: one player claims the radius is 26 cm.",tm:"Knew a chord through the centre is a diameter",m:{p:"Cut the rope: how long is the rope from the centre to the edge?",a:13,h:"A chord through the centre has a special name. How does it relate to the radius?"},t2:{c:"A chord is a straight line joining two points on a circle. A chord that passes through the centre is called a diameter, and it is the longest chord. The radius is half of it.",f:"diameter = 2 × radius<br>the longest chord passes through the centre",e:"A circle has a diameter of 18 cm, so its radius is 18 ÷ 2 = 9 cm.",q:{p:"A chord through the centre of a circle is 30 cm long. What is the radius?",a:15}},c:[12,6,4],ms:["Knew a chord through the centre is a diameter","Measured on a drawing","Guessed"],o:[["Riya","Knew a chord through the centre is a diameter","It is a diameter, and the radius is half, so 26 ÷ 2 = 13."],["Kabir","Measured on a drawing","Drew it to scale and measured from the centre to the edge."],["Aarav","Guessed","Guessed 26, then remembered radius is half the diameter."]]},
{t:"Bisect the bridge",lv:"UNDERSTAND",b:["THE BRIDGE OF CHORDS","Across the plaza run old bridges, each one a straight line joining two points of the edge. The Bridge Builder says every bridge has a secret that tells you how far it sits from the centre."],w:"THE BRIDGE BUILDER",s:"I place a bridge's post by dropping a line from the centre straight down to the bridge. My apprentice swears the post lands exactly in the middle of a 20 m bridge. How far is the post from each end?",tw:"PLANTED ERROR: one player says the post lands closer to one end. The team tests it with a drawing.",tm:"Knew the line from the centre cuts the bridge in half",m:{p:"A line from the centre meets a 20 m bridge at a right angle. How far is the meeting point from each end of the bridge?",a:10,h:"Does the line land closer to one end, or exactly in the middle?"},t2:{c:"A line from the centre of a circle that meets a chord at a right angle always cuts the chord into two equal halves.",f:"the perpendicular from the centre bisects the chord",e:"A chord is 14 cm long. The perpendicular from the centre meets it 7 cm from each end.",q:{p:"A chord is 18 cm long. A line from the centre meets it at a right angle. How far is the meeting point from each end?",a:9}},c:[9,7,4],ms:["Knew the line from the centre cuts the bridge in half","Measured on a drawing","Guessed"],o:[["Meera","Knew the line from the centre cuts the bridge in half","It lands in the middle, so 20 ÷ 2 = 10 from each end."],["Kabir","Measured on a drawing","Drew it with a set square and measured 10 each side."],["Aarav","Guessed","Guessed 10 because the bridge looked balanced."]]},
{t:"Chord and centre",lv:"USE",fg:"fc2",w:"THE BRIDGE BUILDER",s:"My bridge is a chord 16 m long and sits 6 m from the centre. To restore the edge of the plaza I need to know how far the edge is from the centre. Work out the radius.",tw:"SPLIT CLUE: one player holds the chord length and another the distance from the centre. They build the right triangle together.",tm:"Used the perpendicular and Pythagoras",m:{p:"Work out the radius so the edge can be restored.",a:10,h:"A line from the centre, perpendicular to a chord, cuts the chord in half. Look for a right triangle."},t2:{c:"A line from the centre perpendicular to a chord always cuts the chord into two equal halves. That makes a right triangle with the radius as its longest side.",f:"r² = (half the chord)² + d²<br>d = distance from the centre",e:"Chord 24 cm, distance 5 cm: half the chord is 12, so r² = 12² + 5² = 169 and r = 13 cm.",q:{p:"A chord 30 cm long is 8 cm from the centre. What is the radius?",a:17}},c:[8,10,5],ms:["Used the perpendicular and Pythagoras","Drew it and measured","Guessed"],o:[["Meera","Used the perpendicular and Pythagoras","Half the chord is 8, so r² = 8² + 6² = 100 and r = 10."],["Kabir","Drew it and measured","Drew the chord and measured the radius with a ruler."],["Aarav","Guessed","Tried 10 because 6, 8, 10 felt familiar, then checked."]]},
{t:"Equal chords",lv:"ANALYSE",fg:"fc3",w:"THE BRIDGE BUILDER",s:"Two bridges of equal length cross the plaza. The first one's post sits 7 m from the centre. Where should the second one's post go? How far from the centre?",tw:"PLANTED ERROR: one player says the second bridge must sit farther away because it looks longer in the drawing. The team corrects it.",tm:"Equal chords are equally far from the centre",m:{p:"Chords AB and CD are equal in length. AB is 7 m from the centre. How far from the centre must CD be?",a:7,h:"What do equal chords have in common about their distance from the centre?"},t2:{c:"In a circle, chords of equal length are always at equal distances from the centre. It also works the other way: chords at equal distances from the centre are equal in length.",f:"equal chords ⇔ equal distances from the centre",e:"AB = CD and AB is 5 cm from the centre, so CD is also 5 cm from the centre.",q:{p:"Two chords are each 4 cm from the centre. One is 10 cm long. How long is the other?",a:10}},c:[9,6,5],ms:["Equal chords are equally far from the centre","Compared the drawing","Guessed"],o:[["Riya","Equal chords are equally far from the centre","Equal chords sit at equal distances, so it is also 7 cm."],["Kabir","Compared the drawing","Drew two equal chords and measured both distances."],["Aarav","Guessed","Said 7 because the question gave only one number."]]},
{t:"Angle at the centre",lv:"USE",fg:"fc4",b:["THE ARCHERY WALL","Beyond the bridges is the archery wall. The Archer says a shot from the centre and a shot from the edge can hit the same arc, but they do not see the same angle."],w:"THE ARCHER",s:"My target arc makes 70 degrees when seen from the centre of the plaza. The wall archers stand on the edge. What angle do they see?",tw:"PLANTED ERROR: one player says the angle at the circle is 140°, doubling instead of halving. The team catches it.",tm:"Angle at the circle is half the angle at the centre",m:{p:"What angle do the archers on the wall see? The arc makes 70° at the centre. Enter the angle at the wall.",a:35,h:"One of the two angles is double the other. Which one is bigger?"},t2:{c:"For any arc, the angle it makes at the centre is twice the angle it makes at any point on the rest of the circle.",f:"angle at the centre = 2 × angle at the circle",e:"An arc makes 100° at the centre, so it makes 50° at any point on the rest of the circle.",q:{p:"An arc makes 120° at the centre. What angle does it make at a point on the rest of the circle?",a:60}},c:[10,7,5],ms:["Angle at the circle is half the angle at the centre","Drew it and measured","Guessed"],o:[["Meera","Angle at the circle is half the angle at the centre","70 ÷ 2 = 35."],["Kabir","Drew it and measured","Drew the circle and measured the angle at the edge with a protractor."],["Aarav","Guessed","Guessed 70 first, then saw the centre angle is the bigger one."]]},
{t:"Same segment",lv:"USE",fg:"fc5",w:"THE ARCHER",s:"Two archers stand on the same arc and aim at the same two posts. The first sees a 40 degree angle. What does the second see?",tw:"SPLIT: each player places their archer at a different point on the same arc and the team compares the angles they see.",tm:"Angles in the same segment are equal",m:{p:"Points P and Q lie on the same arc, and both look at the chord AB. Angle APB is 40°. What is angle AQB?",a:40,h:"P and Q are on the same side of the chord. What do their angles have in common?"},t2:{c:"Points on the same side of a chord see it at the same angle. So angles in the same segment, drawn on the same chord, are equal.",f:"angles in the same segment are equal",e:"If angle ACB is 55° and D is on the same arc, then angle ADB is also 55°.",q:{p:"Angle AXB is 48° and Y is another point on the same arc. What is angle AYB?",a:48}},c:[9,7,6],ms:["Angles in the same segment are equal","Drew it and measured","Guessed"],o:[["Riya","Angles in the same segment are equal","Both points are on the same arc, so the angle is also 40°."],["Kabir","Drew it and measured","Moved Q around the arc and the angle never changed."],["Aarav","Guessed","Guessed 80, then noticed the chord is the same."]]},
{t:"Angle in a semicircle",lv:"ANALYSE",fg:"fc6",b:["THE STARGAZER TOWER","At the top of the tower the Stargazer draws a line across the plaza from edge to edge, passing through the centre. Stars sit on the circle, and every one of them sees the line at the same strange angle."],w:"THE STARGAZER",s:"A diameter crosses the plaza and a star sits on the edge. From one end of the diameter the star makes 35 degrees. What is the angle at the other end?",tw:"PLANTED ERROR: one player says the angle at the other end must also be 35°. The team finds the missing angle.",tm:"Used angle in a semicircle is 90°",m:{p:"AB is a diameter of a circle and C lies on the circle. Angle CAB is 35°. What is angle ABC?",a:55,h:"The star sees the diameter at a fixed angle, whichever point of the circle it sits on. What is that angle?"},t2:{c:"Any point on a circle sees a diameter at a right angle. So the triangle formed with the diameter always has a 90° angle at the point on the circle.",f:"angle in a semicircle = 90°",e:"AB is a diameter and angle CAB = 50°. Angle ACB = 90°, so angle ABC = 180° − 90° − 50° = 40°.",q:{p:"AB is a diameter and angle CAB is 28°. What is angle ABC?",a:62}},c:[8,8,6],ms:["Used angle in a semicircle is 90°","Drew it and measured","Guessed"],o:[["Meera","Used angle in a semicircle is 90°","Angle C is 90°, so ABC = 180 − 90 − 35 = 55."],["Kabir","Drew it and measured","Drew the triangle and measured the last angle."],["Aarav","Guessed","Guessed 35, then checked the triangle total."]]},
{t:"Cyclic quadrilateral",lv:"USE",fg:"fc7",w:"THE STARGAZER",s:"Four stars sit on the edge of the plaza and form a four-sided shape. One corner measures 105 degrees. What does the corner opposite it measure?",tw:"SPLIT: each player gets one corner angle, and the team checks which pairs add up to 180°.",tm:"Opposite angles add to 180°",m:{p:"ABCD is a quadrilateral with all four corners on a circle. Angle A is 105°. What is the opposite angle C?",a:75,h:"Opposite angles of a quadrilateral on a circle are linked by a fixed total."},t2:{c:"When all four corners of a quadrilateral lie on a circle, it is called cyclic. Its opposite angles always add up to 180°.",f:"cyclic quadrilateral: opposite angles add to 180°",e:"Angle B = 80°, so the opposite angle D = 180° − 80° = 100°.",q:{p:"In a cyclic quadrilateral, angle B is 112°. What is the opposite angle D?",a:68}},c:[9,6,5],ms:["Opposite angles add to 180°","Drew it and measured","Guessed"],o:[["Riya","Opposite angles add to 180°","180 − 105 = 75."],["Kabir","Drew it and measured","Drew a circle, made the shape and measured angle C."],["Aarav","Guessed","Guessed 105 because opposite looked equal, then fixed it."]]},
{t:"Could they be on a circle?",lv:"DECIDE",w:"THE STARGAZER",s:"A thief claims four torches stand on the plaza's edge. I measured two opposite corners of the shape they make: 110 degrees and 80 degrees. If the torches are truly on the circle, those angles must obey a rule. Can they be on the circle?",tw:"PLANTED ERROR: one player says any four-sided shape can sit on a circle. The team tests the rule.",tm:"Checked the opposite angles add to 180°",m:{p:"Opposite corners measure 110° and 80°. Can all four corners lie on a circle? 1) Yes   2) No. Type 1 or 2.",a:2,h:"What do opposite angles of a four-sided shape on a circle add up to?"},t2:{c:"If a four-sided shape has all its corners on one circle, its opposite angles must add up to 180°. If they do not, the corners cannot all lie on a circle.",f:"opposite angles add to 180° ⇔ the corners can lie on a circle",e:"Opposite angles 100° and 80° add to 180°, so the corners can lie on a circle.",q:{p:"Opposite corners measure 95° and 85°. Can all four corners lie on a circle? 1) Yes   2) No. Type 1 or 2.",a:1}},c:[9,6,4],ms:["Checked the opposite angles add to 180°","Drew it and tried","Guessed"],o:[["Riya","Checked the opposite angles add to 180°","110 + 80 = 190, not 180, so no."],["Kabir","Drew it and tried","Tried drawing a circle through the corners and it would not fit."],["Aarav","Guessed","Said yes first, then added the angles and changed my mind."]]},
{t:"Create: circle puzzle",lv:"CREATE",w:"THE POTTER",s:"Make a circle puzzle of your own for the next hero. Choose an arc and I will fire it in the kiln.",tw:"SWAP: trade puzzles and solve each other's.",cg:{labs:["angle"],pf:"Make a puzzle: choose an even angle in degrees at the centre. The next hero must find the angle the same arc makes at the circle. Add a clue and save.",ok:function(v){return v[0]>0&&v[0]<=360&&v[0]%2===0},hint:"Choose an even number between 2 and 360.",make:function(v){return"An arc makes "+v[0]+" degrees at the centre. What angle does it make at the circle?"}}}];
var UL6=[
{t:"Seed packets",lv:"NOTICE",fg:"sqgrid",b:["THE SCORCHED FIELDS","Dragon fire swept across the Kingdom of Fields, burning every fence and wiping out every boundary stone. The farmers stand on black earth and cannot agree on what belongs to whom. The Shutter Shades, the artefact that shows the true size of any land, hang in the Land Office."],w:"THE FARMER",s:"Before any fence, I must plant. Each seed packet covers exactly one square metre, and my burned field is 6 m long and 4 m wide. How many packets do I need to buy?",tw:"SPLIT: each player counts one row of squares and the team adds them.",tm:"Rows times squares in a row",m:{p:"The field is 6 m long and 4 m wide. Each packet covers one square metre. How many packets are needed?",a:24,h:"Picture the field as rows of 1 m squares. How many rows, and how many squares in each row?"},t2:{c:"The area of a shape is how many unit squares fit inside it. For a rectangle, count the squares in one row and multiply by the number of rows.",f:"area = length × breadth",e:"A field 5 m by 3 m holds 3 rows of 5 squares, so 15 square metres.",q:{p:"A field is 7 m long and 5 m wide. How many one-square-metre packets are needed?",a:35}},c:[12,8,4],ms:["Rows times squares in a row","Counted every square","Guessed"],o:[["Riya","Rows times squares in a row","4 rows of 6 squares is 4 × 6 = 24."],["Kabir","Counted every square","Counted all the squares on the grid one by one: 24."],["Aarav","Guessed","Guessed 20, then counted rows and fixed it to 24."]]},
{t:"Fence or field?",lv:"UNDERSTAND",fg:"ffield",w:"THE FARMER",s:"My field is 12 m long and 5 m wide, and the fire took every fence. How much new fence do I need to go all the way around?",tw:"PLANTED ERROR: one player multiplies the sides and says 60 m. The team finds out they worked out the area, not the fence.",tm:"Used 2(l + b)",m:{p:"A rectangular field is 12 m long and 5 m wide. How many metres of fence go all the way around it?",a:34,h:"Fence goes around the edge. Think about how many sides there are."},t2:{c:"The perimeter is the distance all the way around a shape, and it tells you how much fence you need. The area is the space inside, and it tells you how much ground you cover. They are different measures.",f:"perimeter = 2(l + b)<br>area = l × b",e:"A field 8 m by 3 m: perimeter = 2(8 + 3) = 22 m, area = 8 × 3 = 24 square metres.",q:{p:"A field is 9 m long and 6 m wide. How many metres of fence go around it?",a:30}},c:[10,9,7],ms:["Used 2(l + b)","Added the four sides","Drew the field and counted the edge"],o:[["Riya","Used 2(l + b)","2 × (12 + 5) = 2 × 17 = 34."],["Kabir","Added the four sides","12 + 5 + 12 + 5 = 34."],["Aarav","Drew the field and counted the edge","Drew the field on squared paper and counted the metres around the edge: 34."]]},
{t:"Same fence, different ground",lv:"ANALYSE",fg:"frs2",b:["THE FENCE YARD","A pile of fence panels is all the farmers have left. The Fencer says the same fence can enclose very different fields, and the farmers are about to learn which one to build."],w:"THE FENCER",s:"I have exactly 40 m of fence and four possible pens. Every pen uses all of the fence. Which pen gives the animals the most ground?",tw:"SPLIT: each player works out the area of one pen, and the team shares results before voting.",tm:"Worked out each area",m:{p:"A farmer has 40 m of fence and builds a rectangular pen. Which pen encloses the most ground? 1) 15 m by 5 m   2) 12 m by 8 m   3) 10 m by 10 m   4) 18 m by 2 m. Type 1, 2, 3 or 4.",a:3,h:"Check each pen really uses 40 m of fence, then compare the ground inside each."},t2:{c:"For a fixed perimeter, the more square a rectangle is, the bigger its area. Long thin shapes waste fence on edges and enclose little ground.",f:"same perimeter: the square has the biggest area",e:"With 24 m of fence: 10 by 2 gives 20, 8 by 4 gives 32, 6 by 6 gives 36. The square wins.",q:{p:"With 36 m of fence, which pen encloses the most ground? 1) 10 m by 8 m   2) 9 m by 9 m   3) 12 m by 6 m   4) 15 m by 3 m. Type 1, 2, 3 or 4.",a:2}},c:[11,8,6],ms:["Worked out each area","Picked the most square-looking pen","Guessed"],o:[["Meera","Worked out each area","75, 96, 100 and 36. The 10 by 10 pen is the biggest."],["Kabir","Picked the most square-looking pen","The squarest one holds the most, so 10 by 10."],["Aarav","Guessed","Guessed the longest pen, then checked and was wrong."]]},
{t:"Same ground, least fence",lv:"ANALYSE",fg:"frs3",w:"THE FENCER",s:"The farmer wants exactly 36 square metres of ground and wants to spend as little fence as possible. Which plot should I build?",tw:"SPLIT: each player works out the fence for one plot. PLANTED ERROR: one player claims the long thin plot needs the least fence.",tm:"Worked out each fence length",m:{p:"A farmer needs 36 square metres of ground. Which rectangular plot needs the least fence? 1) 36 m by 1 m   2) 12 m by 3 m   3) 9 m by 4 m   4) 6 m by 6 m. Type 1, 2, 3 or 4.",a:4,h:"Work out the fence (the perimeter) each plot needs."},t2:{c:"The same idea works the other way round. For a fixed area, the more square a rectangle is, the smaller its perimeter, so the less fence it needs.",f:"same area: the square has the smallest perimeter",e:"Area 16: 16 by 1 needs 34 m of fence, 8 by 2 needs 20 m, 4 by 4 needs 16 m. The square wins.",q:{p:"A farmer needs 64 square metres. Which plot needs the least fence? 1) 64 m by 1 m   2) 16 m by 4 m   3) 8 m by 8 m   4) 32 m by 2 m. Type 1, 2, 3 or 4.",a:3}},c:[10,8,5],ms:["Worked out each fence length","Picked the most square-looking plot","Guessed"],o:[["Riya","Worked out each fence length","74, 30, 26 and 24. The 6 by 6 plot needs the least."],["Kabir","Picked the most square-looking plot","Squares are the tightest shape, so 6 by 6."],["Aarav","Guessed","Guessed 12 by 3, then worked out the others and fixed it."]]},
{t:"The L-shaped field",lv:"ANALYSE",fg:"fl",w:"THE FARMER",s:"The king's field is shaped like an L: a 10 m by 6 m rectangle with a 4 m by 3 m corner cut away by the river. He wants to know how many seed packets it needs, and my clerks each gave a different answer.",tw:"SPLIT: one player cuts the L into two rectangles and another takes the corner away. They compare answers.",m:{p:"An L-shaped field is a 10 m by 6 m rectangle with a 4 m by 3 m corner cut away. What is its area in square metres?",a:48,h:"You can cut the L into two rectangles, or take the missing corner away from the whole rectangle."},c:[9,10],ms:["Split it into two rectangles","Took the missing corner away"],o:[["Meera","Split it into two rectangles","A 6 by 6 block and a 4 by 3 block: 36 + 12 = 48."],["Kabir","Took the missing corner away","10 × 6 = 60, minus the cut corner 4 × 3 = 12, gives 48."]]},
{t:"Triangle plots",lv:"USE",fg:"ftri",b:["THE TRIANGLE ORCHARDS","Past the farms, the orchards grow in three-cornered plots. The Mason says every triangle is half of something simpler."],w:"THE MASON",s:"This orchard is a triangle with a base of 14 m, and from its tip down to the base it measures 9 m. How much ground does it cover?",tw:"PLANTED ERROR: one player forgets the half and says 126. The team spots it.",tm:"Half of base times height",m:{p:"A triangular plot has a base of 14 m and a height of 9 m. What is its area in square metres?",a:63,h:"A triangle is half of a rectangle with the same base and height."},t2:{c:"A triangle is exactly half of a rectangle with the same base and height. So its area is half of base times height.",f:"area = ½ × base × height",e:"A triangle with base 10 m and height 6 m has area ½ × 10 × 6 = 30 square metres.",q:{p:"A triangular plot has a base of 8 m and a height of 11 m. What is its area?",a:44}},c:[9,8,5],ms:["Half of base times height","Doubled it into a rectangle and halved","Guessed"],o:[["Meera","Half of base times height","½ × 14 × 9 = 63."],["Kabir","Doubled it into a rectangle and halved","14 × 9 = 126 for the rectangle, and the triangle is half, so 63."],["Aarav","Guessed","Guessed 126, then remembered the half."]]},
{t:"Round and round",lv:"USE",fg:"fwheel",b:["THE ROUND POND","At the centre of the kingdom is a great round pond, the only thing the dragon could not burn. The Mason says that to rebuild around it you need the distance around a circle and the space inside it."],w:"THE MASON",s:"My measuring wheel has a radius of 21 cm. Roll it one full turn along the ground and tell me how far it travels.",tw:"SPLIT: one player knows only the radius and another only that the wheel turns once. Together they find the distance.",tm:"Used 2πr",m:{p:"A wheel has a radius of 21 cm. How far does it roll in one full turn? Use π = 22/7.",a:132,h:"One full turn rolls out the distance around the wheel. That is called the circumference."},t2:{c:"The distance around a circle is called its circumference. It is always a little more than 3 times the diameter, and that number is π.",f:"circumference = 2πr<br>π is about 22/7",e:"A wheel with radius 7 cm: 2 × 22/7 × 7 = 44 cm in one turn.",q:{p:"A wheel has a radius of 14 cm. How far does it roll in one full turn? Use π = 22/7.",a:88}},c:[9,9,4],ms:["Used 2πr","Used π times the diameter","Guessed"],o:[["Riya","Used 2πr","2 × 22/7 × 21 = 132 cm."],["Kabir","Used π times the diameter","The diameter is 42, and 22/7 × 42 = 132."],["Aarav","Guessed","Guessed about 3 times the diameter, then calculated 132."]]},
{t:"Area of the pond",lv:"USE",fg:"fpond",w:"THE MASON",s:"Now the pond itself. Its radius is 14 m. How many square metres of water does it hold on its surface?",tw:"PLANTED ERROR: one player uses 2πr and gets 88. The team explains why that is the wrong measure.",tm:"Used πr²",m:{p:"A circular pond has a radius of 14 m. What is its area? Use π = 22/7.",a:616,h:"Area uses the radius twice. Do not confuse it with the distance around."},t2:{c:"The area of a circle is π times the radius multiplied by itself. Area is measured in square units, so the radius is used twice.",f:"area = πr²<br>circumference = 2πr",e:"A pond with radius 7 m: 22/7 × 7 × 7 = 154 square metres.",q:{p:"A pond has a radius of 21 m. What is its area? Use π = 22/7.",a:1386}},c:[10,7,5],ms:["Used πr²","Counted squares on a grid","Guessed"],o:[["Meera","Used πr²","22/7 × 14 × 14 = 22 × 2 × 14 = 616."],["Kabir","Counted squares on a grid","Drew the pond on squared paper and counted, getting about 616."],["Aarav","Guessed","Guessed 88, then saw that was the distance around."]]},
{t:"Heron's trick",lv:"ANALYSE",fg:"fheron",b:["THE LAND OFFICE","The Land Office keeps the oldest maps. Their plots have odd shapes, and nobody can find the height of a triangle with no way to drop a line to the ground. The Cartographer has a trick that needs only the sides."],w:"THE CARTOGRAPHER",s:"This old plot is a triangle with sides 13 m, 14 m and 15 m. Nobody knows its height. Can you still find its area?",tw:"SPLIT: one player works out s, another s − a, s − b and s − c, and the team multiplies and takes the root.",tm:"Used Heron's formula",m:{p:"A triangular field has sides 13 m, 14 m and 15 m. What is its area in square metres?",a:84,h:"You know all three sides but no height. Start with half the perimeter."},t2:{c:"When you know all three sides of a triangle but not its height, find half the perimeter, called s. Then use Heron's formula to get the area.",f:"s = (a + b + c) / 2<br>area = <span class='rt'>√<span class='ov'>s(s − a)(s − b)(s − c)</span></span>",e:"Sides 3, 4, 5: s = 6, so area = <span class='rt'>√<span class='ov'>6 × 3 × 2 × 1</span></span> = <span class='rt'>√<span class='ov'>36</span></span> = 6.",q:{p:"A triangle has sides 5 m, 12 m and 13 m. What is its area? Use Heron's formula.",a:30}},c:[8,9,5],ms:["Used Heron's formula","Found the height first","Guessed"],o:[["Riya","Used Heron's formula","s = 21, so the area is the root of 21 × 8 × 7 × 6 = 7056, which is 84."],["Kabir","Found the height first","Dropped a height of 12 on the 14 side using right triangles, then ½ × 14 × 12 = 84."],["Aarav","Guessed","Guessed 90, then used the formula and got 84."]]},
{t:"Brahmagupta's plot",lv:"ANALYSE",fg:"fcq",b:["THE CARTOGRAPHERS TOWER","At the top of the Land Office the Cartographer unrolls her oldest map: a four-sided plot with all four corners on a ring of stones. A mathematician from long ago, Brahmagupta, found a formula for exactly this shape."],w:"THE CARTOGRAPHER",s:"The ring plot has sides 7 m, 15 m, 20 m and 24 m, and every corner touches the ring. Find the ground it covers.",tw:"PLANTED ERROR: one player says the formula cannot be used because the plot is not a rectangle. The team explains what cyclic means.",tm:"Used Brahmagupta's formula",m:{p:"A four-sided plot with all corners on a circle has sides 7 m, 15 m, 20 m and 24 m. What is its area in square metres?",a:234,h:"All four corners lie on a circle, so a special formula applies. Start with half the perimeter."},t2:{c:"For a four-sided shape with all corners on a circle (a cyclic quadrilateral), find half the perimeter s. Then Brahmagupta's formula gives the area from the four sides alone.",f:"s = (a + b + c + d) / 2<br>area = <span class='rt'>√<span class='ov'>(s − a)(s − b)(s − c)(s − d)</span></span>",e:"A 6 by 8 rectangle is cyclic. Sides 6, 8, 6, 8: s = 14, so area = <span class='rt'>√<span class='ov'>8 × 6 × 8 × 6</span></span> = <span class='rt'>√<span class='ov'>2304</span></span> = 48.",q:{p:"A rectangle 5 m by 6 m is cyclic. Use Brahmagupta's formula with sides 5, 6, 5, 6 to find its area.",a:30}},c:[6,5,4],ms:["Used Brahmagupta's formula","Split into two right triangles","Guessed"],o:[["Meera","Used Brahmagupta's formula","s = 33, so the area is the root of 26 × 18 × 13 × 9 = 54756, which is 234."],["Kabir","Split into two right triangles","7, 24 and 15, 20 share a hypotenuse of 25, so the area is ½ × 7 × 24 + ½ × 15 × 20 = 84 + 150 = 234."],["Aarav","Guessed","Guessed 250, then tried the formula and got 234."]]},
{t:"Create: plot puzzle",lv:"CREATE",w:"THE FARMER",s:"Draw me a plot of your own, and leave a clue so the next hero can find how much fence and how much ground it needs.",tw:"SWAP: trade plots and find each other's fence and area.",cg:{labs:["length","breadth"],pf:"Design a rectangular plot: choose a length and a breadth in metres. The next hero must find both the fence and the ground it covers. Add a clue and save.",ok:function(v){return v[0]>0&&v[1]>0},hint:"Both numbers must be bigger than 0.",make:function(v){return"A plot is "+v[0]+" m by "+v[1]+" m. How much fence goes around it, and how much ground does it cover?"}}}];
var UL7=[
{t:"Flip the royal coin",lv:"NOTICE",b:["THE CARNIVAL","The tents of the carnival flap in the ash wind. Every stall is rigged, the stallholders say, and every player thinks they know how to win. The Gambler says the kingdom can be mended only by someone who knows how to measure luck."],w:"THE GAMBLER",s:"Step right up! This is the royal coin, and everyone swears it lands heads more than tails. I say it is fair. Flip it as many times as you like, then tell me: out of every 10 flips, about how many come up heads?",tw:"SPLIT: each player flips a different number of times and the team compares their results.",tm:"Used equal outcomes",m:{sim:{f:function(){return Math.random()<.5?"Heads":"Tails"},labels:["Heads","Tails"],steps:[1,10,50],verb:"FLIP"},p:"Flip the coin many times and watch the counts. Out of every 10 flips, about how many are heads?",v:function(v){return v>=4&&v<=6},h:"Flip many times and compare the number of heads with the total number of flips."},t2:{c:"Probability measures how likely something is, from 0 (never) to 1 (certain). When all outcomes are equally likely, count the outcomes you want and divide by all the outcomes.",f:"probability = favourable outcomes / total outcomes",e:"A coin has 2 equally likely sides and 1 of them is heads, so P(heads) = 1/2.",q:{p:"A bag holds 3 red and 5 blue marbles. What is the probability of picking red? Enter it as a decimal.",a:0.375}},c:[7,10,4],ms:["Used equal outcomes","Flipped many times and compared","Guessed"],o:[["Riya","Used equal outcomes","Two sides, one is heads, so about half: 5 out of 10."],["Kabir","Flipped many times and compared","Flipped 100 times and got 52 heads, so about 5 in 10."],["Aarav","Guessed","Guessed 7, then flipped and saw it was close to 5."]]},
{t:"All the outcomes",lv:"UNDERSTAND",w:"THE GAMBLER",s:"New game: I flip two coins at once, and you win only if both come up heads. Before you bet your shoes, count how many different results the two coins can show.",tw:"SPLIT: one player lists results with the first coin heads, another with the first coin tails.",tm:"Listed every result",m:{p:"Two coins are flipped. How many different results are possible? 1) 2   2) 3   3) 4   4) 6. Type 1, 2, 3 or 4.",a:3,h:"List them: the first coin can be heads or tails, and so can the second."},t2:{c:"To count all outcomes, list them in order so none is missed. For two coins, each outcome is a pair like HT, with the first letter for the first coin. The total is the number of choices for one coin times the number for the other.",f:"outcomes = (outcomes of coin 1) × (outcomes of coin 2)",e:"One coin and one die: 2 × 6 = 12 outcomes.",q:{p:"A coin is flipped and a three-sided spinner is spun. How many different results are possible? 1) 3   2) 5   3) 6   4) 8. Type 1, 2, 3 or 4.",a:3}},c:[9,8,5],ms:["Listed every result","Multiplied 2 × 2","Guessed"],o:[["Riya","Listed every result","HH, HT, TH, TT: four."],["Kabir","Multiplied 2 × 2","Two choices for each coin, so 2 × 2 = 4."],["Aarav","Guessed","Said 3 (two heads, two tails, one of each), then noticed HT and TH are different."]]},
{t:"Chance of a six",lv:"USE",w:"THE DICE MAKER",s:"Welcome to my tent. I make the fairest dice in the kingdom, and a six wins the grand prize. A customer asks what his chances are. Tell me how many faces win and how many faces there are in all, and I will print the odds on my sign.",tw:"PLANTED ERROR: one player says the chance is 6 because there are 6 faces. The team corrects it.",m:{p:"A fair die is rolled and a six wins. Enter the number of winning faces and the number of faces in all.",a:[1,6],lab:["winning faces","all faces"],h:"How many faces show a six? How many faces are there in total?"},c:[10,5],ms:["Counted winning over total","Guessed"],o:[["Meera","Counted winning over total","One face shows a six out of six faces, so 1 and 6."],["Aarav","Guessed","Said 6 and 6 at first, then looked at the die again."]]},
{t:"Even prize",lv:"USE",w:"THE DICE MAKER",s:"A second prize pays on any even number. Count the winning faces for the new prize, and the faces in all, so I can print the odds on my sign.",tw:"SPLIT: one player lists the even faces and another the odd faces.",m:{p:"A fair die is rolled and any even number wins. Enter the number of winning faces and the number of faces in all.",a:[3,6],lab:["winning faces","all faces"],h:"Which faces show 2, 4 or 6? Count them."},c:[9,4],ms:["Counted winning over total","Guessed"],o:[["Riya","Counted winning over total","2, 4 and 6 win, so 3 out of 6."],["Aarav","Guessed","Guessed 2, then counted 2, 4 and 6."]]},
{t:"Fair or loaded?",lv:"ANALYSE",b:["THE DICE TENT","In the dice tent a loaded die changes hands. The Dice Maker says luck can be tested, if you are patient enough to roll."],w:"THE DICE MAKER",s:"A loaded die has been swapped into my tent, and I cannot tell which one. Roll this one many times and watch the counts. Is it fair, or is it loaded?",tw:"SPLIT: each player rolls part of the total and the team adds the counts together before voting.",tm:"Compared each face's share to 1/6",m:{sim:{f:function(){return String(Math.random()<.4?6:1+Math.floor(Math.random()*5))},labels:["1","2","3","4","5","6"],steps:[1,10,50],verb:"ROLL"},p:"Roll the die many times and compare the counts. Is it fair or loaded? 1) fair   2) loaded. Type 1 or 2.",a:2,h:"A fair die should show each face about the same number of times."},t2:{c:"The experimental probability of an event is how often it happened out of all the trials. For a fair die, each face should come up about 1/6 of the time. A face far above or below that suggests the die is loaded.",f:"experimental probability = times it happened / total trials",e:"A die is rolled 60 times and shows a 6 on 24 of them. 24/60 = 0.4, far more than 1/6 (about 0.17), so it looks loaded.",q:{p:"A die is rolled 60 times and a 6 appears 11 times. Does it look fair or loaded? 1) fair   2) loaded. Type 1 or 2.",a:1}},c:[7,9,4],ms:["Compared each face's share to 1/6","Looked for a face far ahead of the others","Guessed"],o:[["Meera","Compared each face's share to 1/6","The 6 came up about 40% of the time, far above 1/6, so it is loaded."],["Kabir","Looked for a face far ahead of the others","One face was far ahead of the other five, much more than a fair die would give, so it is loaded."],["Aarav","Guessed","Said loaded because the Dice Maker warned us."]]},
{t:"Spin the wheel",lv:"USE",w:"THE GAMBLER",s:"My wheel landed on red 15 times in 50 spins this morning. The mayor wants a single number for the sign: what is the experimental probability of red? Give it to him as a decimal.",tw:"PLANTED ERROR: one player says it is 15 out of 100. The team checks the number of spins.",m:{p:"In 50 spins the wheel landed on red 15 times. What is the experimental probability of red? Enter it as a decimal.",a:0.3,h:"Divide the number of reds by the number of spins."},c:[10,5],ms:["Divided reds by spins","Guessed"],o:[["Riya","Divided reds by spins","15 ÷ 50 = 0.3."],["Aarav","Guessed","Guessed 0.5, then divided 15 by 50."]]},
{t:"Design the wheel",lv:"ANALYSE",fg:"spin8",w:"THE GAMBLER",s:"I want the house to win a quarter of the time, no more and no less, and my wheel has 8 equal sections. I will paint some of them blue and the player wins on blue. How many sections should be blue so the chance is 1/4?",tw:"SPLIT: each player proposes a different number of blue sections and the team tests which gives 1/4.",tm:"Worked backwards from 1/4",m:{p:"A wheel has 8 equal sections. How many should be blue so that the chance of blue is 1/4?",a:2,h:"1/4 of 8 sections. Work out what fraction of 8 sections should be blue."},t2:{c:"Probability can be used to design a game. If you want a chance p, make the winning outcomes p times the total outcomes.",f:"winning outcomes = probability × total outcomes",e:"A spinner with 12 sections should win 1/3 of the time. 1/3 of 12 = 4 winning sections.",q:{p:"A spinner has 10 equal sections. How many should win so that the chance is 3/5?",a:6}},c:[8,9,4],ms:["Worked backwards from 1/4","Tried different numbers","Guessed"],o:[["Riya","Worked backwards from 1/4","1/4 of 8 is 2."],["Kabir","Tried different numbers","1 blue is 1/8, 2 blue is 2/8 = 1/4. That works."],["Aarav","Guessed","Guessed 4, then saw that is half."]]},
{t:"Paths in the sand",lv:"USE",fg:"tree6",b:["THE FORTUNE TELLERS TENT","At the back of the carnival, the Fortune Teller draws paths in the sand. Every journey she foretells splits into branches, and she says a hero must be able to count them."],w:"THE FORTUNE TELLER",s:"I foresee a journey that begins with a coin flip, heads or tails, and then you choose one of three roads. How many different journeys are there? Count them all, or the dragon will find the one you missed.",tw:"SPLIT: one player draws the heads branch and another the tails branch.",tm:"Multiplied the choices",m:{p:"A journey starts with a coin flip and then one of 3 roads. How many different journeys are there?",a:6,h:"Count the ends of the branches on the tree, or multiply the number of choices at each step."},t2:{c:"A tree diagram shows every path: each branch splits into the next set of choices. The number of paths is the number of choices at each step multiplied together.",f:"paths = choices at step 1 × choices at step 2",e:"2 shirts and 4 hats make 2 × 4 = 8 outfits.",q:{p:"A traveller picks one of 3 roads and then one of 5 inns. How many different journeys are there?",a:15}},c:[9,10,4],ms:["Multiplied the choices","Counted paths on the tree","Guessed"],o:[["Riya","Multiplied the choices","2 coin results times 3 roads is 6."],["Kabir","Counted paths on the tree","Counted the ends of the branches: 6."],["Aarav","Guessed","Guessed 5, then counted the tree again."]]},
{t:"Two dice",lv:"ANALYSE",fg:"dice36",w:"THE FORTUNE TELLER",s:"My luckiest number is 7. When a customer rolls two dice, how many of the possible rolls add up to 7, and how many rolls are there altogether? Tell me both so I can print the odds on my tent.",tw:"SPLIT: each player counts the 7s in a different part of the table and the team adds them.",tm:"Used a table of all rolls",m:{p:"Two dice are rolled. Enter the number of rolls that add up to 7 and the number of possible rolls altogether.",a:[6,36],lab:["ways to make 7","all rolls"],h:"Use the table: the first die goes across and the second goes down. Count the cells with sum 7."},t2:{c:"When two things happen together, a table of all outcomes helps you count them without missing any. Each cell is one outcome, and the total is rows times columns.",f:"total outcomes = rows × columns<br>count the cells that match",e:"Two dice: the table has 6 × 6 = 36 cells. Cells that add to 3 are (1, 2) and (2, 1), so 2 out of 36.",q:{p:"Two dice are rolled. In how many of the 36 rolls do the dice add up to 11?",a:2}},c:[8,9,4],ms:["Used a table of all rolls","Listed pairs one by one","Guessed"],o:[["Meera","Used a table of all rolls","The 7s form a diagonal of 6 cells out of 36."],["Kabir","Listed pairs one by one","1+6, 2+5, 3+4, 4+3, 5+2, 6+1: six pairs."],["Aarav","Guessed","Guessed 5, then listed pairs and found 6."]]},
{t:"Which game is fair?",lv:"DECIDE",b:["THE JUDGES BENCH","The carnival's last judge sits behind a plain wooden bench. She will not take anyone's word for it. Every stall owner swears their game is fair, and she wants the hero to decide."],w:"THE JUDGE",s:"Four games stand before my bench, and each stall owner swears his is fair. A game is fair only if the player has a 1 in 2 chance of winning. Which game passes?",tw:"SPLIT: each player works out the chance for one game and the team votes. The hero makes the final call.",tm:"Worked out each chance",m:{p:"Which game gives the player exactly a 1 in 2 chance? 1) two coins both heads   2) two coins show the same   3) two dice add up to 7   4) two dice both show six. Type 1, 2, 3 or 4.",a:2,h:"Work out the chance of each game. A fair game wins on half of all outcomes."},t2:{c:"To judge a game, work out the chance of winning: winning outcomes out of all outcomes. A game is fair when that chance is 1/2.",f:"fair game: P(win) = 1/2",e:"Two coins: HH, HT, TH, TT. Winning on the same face (HH or TT) is 2 out of 4 = 1/2, so it is fair.",q:{p:"A die is rolled. Which bet is fair? 1) win on a six   2) win on an even number   3) win on 1 or 2   4) win on a number above 2. Type 1, 2, 3 or 4.",a:2}},c:[8,9,4],ms:["Worked out each chance","Spotted the matching-coins game","Guessed"],o:[["Riya","Worked out each chance","1/4, 2/4, 6/36 and 1/36. Only the second is 1/2."],["Kabir","Spotted the matching-coins game","HH or TT is half of the four results."],["Aarav","Guessed","Picked the one with coins because coins feel fair."]]},
{t:"Create: fair game",lv:"CREATE",w:"THE GAMBLER",s:"Build me an honest game for the next hero: a wheel with 8 equal sections, where you choose how many are blue. Leave a clue and I will print it on my sign.",tw:"SWAP: trade wheels and work out each other's chance of blue.",cg:{labs:["blue sections"],pf:"Design a wheel with 8 equal sections. Choose how many are blue (from 1 to 7). The next hero must work out the chance of blue. Add a clue and save.",ok:function(v){return v[0]>=1&&v[0]<=7&&v[0]%1===0},hint:"Choose a whole number from 1 to 7.",make:function(v){return"A wheel has 8 equal sections and "+v[0]+" are blue. What is the chance of blue?"}}}];
var UL8=[
{t:"The drum pattern",lv:"NOTICE",fg:"gb1",b:["THE DRUM HALL","The great drum of the Kingdom of Rhythm is smashed, and only the first beats of the old song survive. The Drummer says that every beat in the song grew out of the one before it, if you can only see how."],w:"THE DRUMMER",s:"The great drum is smashed, and only its first four beats survive: 2, 6, 18 and 54 hits. The song cannot go on until someone beats the next one. How many hits go in it?",tw:"SPLIT CLUE: each player sees two neighbouring beats and tells the team how one leads to the next.",m:{p:"The drum's beats so far are 2, 6, 18 and 54 hits. How many hits go in the next beat?",a:162,h:"Compare each beat with the one before it. Is something added each time, or multiplied?"},c:[11,6],ms:["Found the multiplier","Wrote the beats as 2, 2×3, 2×3×3"],o:[["Riya","Found the multiplier","6 ÷ 2 = 3 and 18 ÷ 6 = 3, so each beat is 3 times the last: 54 × 3 = 162."],["Kabir","Wrote the beats as 2, 2×3, 2×3×3","The beats are 2, 2×3, 2×3×3, 2×3×3×3, so the next is 2×3×3×3×3 = 162."]]},
{t:"Double or nothing",lv:"TRY",w:"THE BANKER",s:"My magic purse doubles your coins every day, but it lets you peek at only three days. Feed it a day number and it shows your coins that day. Tell me how many coins you will have on day 10, before the purse shows it.",tw:"SPLIT: each player feeds one day and the team shares the numbers before predicting.",tm:"Found the multiplier",m:{probe:{f:function(x){return Math.pow(2,x)},lab:"day",tries:3,block:10},p:"Feed the purse up to 3 day numbers, watch the coins, then predict your coins on day 10.",a:1024,h:"Compare what the purse shows on neighbouring days. By what does it multiply each day?"},t2:{c:"When each term is the previous one multiplied by the same number (the ratio), the sequence is geometric. The n-th term is the first term multiplied by the ratio n − 1 times.",f:"n-th term = a × r^(n − 1)<br>a = first term, r = ratio",e:"3, 6, 12, 24 has a = 3 and r = 2. The 6th term is 3 × 2⁵ = 96.",q:{p:"A purse starts with 5 coins on day 1 and triples every day. How many coins on day 4?",a:135}},c:[8,12,5],ms:["Found the multiplier","Kept doubling to day 10","Guessed"],o:[["Meera","Found the multiplier","Day 1 is 2, day 2 is 4, day 3 is 8, so it doubles. Day 10 is 2 × 2⁹ = 1024."],["Kabir","Kept doubling to day 10","Doubled again and again: 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024."],["Aarav","Guessed","Guessed 20, then saw it doubles and fixed it to 1024."]]},
{t:"Add or multiply?",lv:"UNDERSTAND",w:"THE DANCER",s:"A dance is steady only if each row has the same number of extra dancers as the row before. The Minstrel sketched four formations, and only one is steady. Which one?",tw:"PLANTED ERROR: one player says 3, 6, 12, 24 is steady because it keeps going up. The team checks the gaps.",tm:"Checked the gaps between neighbours",m:{p:"Which formation adds the same number of dancers each row? 1) 3, 6, 12, 24   2) 3, 6, 9, 12   3) 1, 4, 9, 16   4) 2, 3, 5, 8. Type 1, 2, 3 or 4.",a:2,h:"Find the gap between each row and the next. Is it always the same?"},t2:{c:"A sequence where you add the same number each time is an arithmetic progression (AP). One where you multiply by the same number each time is a geometric progression (GP).",f:"AP: next = previous + d (d = common difference)<br>GP: next = previous × r (r = common ratio)",e:"5, 8, 11, 14 is an AP with d = 3. 3, 6, 12, 24 is a GP with r = 2.",q:{p:"Which is a geometric progression? 1) 2, 4, 6, 8   2) 2, 4, 8, 16   3) 2, 4, 7, 11   4) 1, 2, 3, 5. Type 1, 2, 3 or 4.",a:2}},c:[9,7,4],ms:["Checked the gaps between neighbours","Tried adding and multiplying","Guessed"],o:[["Riya","Checked the gaps between neighbours","The gaps in 3, 6, 9, 12 are 3 each time. The others change."],["Kabir","Tried adding and multiplying","3, 6, 9, 12 is plus 3 every time. 3, 6, 12, 24 is times 2."],["Aarav","Guessed","Picked the second one because the numbers looked even."]]},
{t:"The long drum roll",lv:"USE",fg:"bars7",w:"THE DRUMMER",s:"The roll must last 20 rounds. Round 1 has 7 hits and every round has 4 more than the one before, and the drummers cannot count to round 20 by hand. How many hits are in round 20?",tw:"SPLIT: each player works out part of the way (rounds 1 to 5, 6 to 10, and so on) and the team joins the results.",tm:"Used a + (n − 1)d",m:{p:"The rounds have 7, 11, 15 and 19 hits, and the pattern goes on. How many hits are in round 20?",a:83,h:"Round 20 is 19 steps after round 1. How much does each step add?"},t2:{c:"In an arithmetic progression with first term a and common difference d, the n-th term is the first term plus (n − 1) steps of d.",f:"n-th term = a + (n − 1)d",e:"5, 8, 11, … has a = 5 and d = 3. The 10th term is 5 + 9 × 3 = 32.",q:{p:"The pattern is 3, 9, 15, 21 and so on. What is the 15th term?",a:87}},c:[10,10,3],ms:["Used a + (n − 1)d","Kept adding 4 up to round 20","Guessed"],o:[["Meera","Used a + (n − 1)d","7 + 19 × 4 = 7 + 76 = 83."],["Kabir","Kept adding 4 up to round 20","Wrote 7, 11, 15, 19, 23 and kept adding 4 until the 20th: 83."],["Aarav","Guessed","Guessed 80, then used the formula and got 83."]]},
{t:"Which round is it?",lv:"ANALYSE",w:"THE DRUMMER",s:"The Masked Minstrel will step in at the round that has exactly 99 hits. Counting from round 1, which round is that?",tw:"PLANTED ERROR: one player says round 25 because 99 ÷ 4 is about 25. The team checks the first term.",tm:"Worked backwards from 99",m:{p:"The rounds have 7, 11, 15 and 19 hits, and so on. Which round has exactly 99 hits?",a:24,h:"Work backwards: take away the first 7, then see how many steps of 4 fit."},t2:{c:"To find which term has a given value, work backwards. Take away the first term, divide by d, then add 1 for the first term itself.",f:"n = (term − a) / d + 1",e:"5, 8, 11, … Which term is 53? (53 − 5) / 3 + 1 = 17.",q:{p:"The pattern is 4, 9, 14, 19 and so on. Which term is 74?",a:15}},c:[8,11,4],ms:["Worked backwards from 99","Kept adding 4 until 99","Guessed"],o:[["Riya","Worked backwards from 99","99 − 7 = 92, and 92 ÷ 4 = 23 steps, so it is round 24."],["Kabir","Kept adding 4 until 99","Counted up 7, 11, 15, … and reached 99 at the 24th."],["Aarav","Guessed","Guessed 25, then checked that round 25 has 103."]]},
{t:"The rumour",lv:"USE",fg:"gb2",b:["THE MARKET","The market square buzzes. Gossip travels faster than any messenger, and the Banker keeps the books. The Trader says the dragon's greatest trick was making people believe rumours grow slowly."],w:"THE MARKET TRADER",s:"A rumour about the dragon is spreading. On day 1 only 3 people hear it, and every day the number of people who hear it triples. How many people hear it on day 5?",tw:"SPLIT: each player works out one day and passes the number on to the next player.",tm:"Used a × r^(n − 1)",m:{p:"On day 1, 3 people hear the rumour, and the number triples each day. How many people hear it on day 5?",a:243,h:"Each day multiplies by the same number. Do that 4 times from day 1."},t2:{c:"For a geometric progression, the n-th term is the first term times the ratio, multiplied together (n − 1) times.",f:"n-th term = a × r^(n − 1)",e:"2, 6, 18, … has a = 2 and r = 3. The 5th term is 2 × 3⁴ = 162.",q:{p:"A tank has 2 litres on day 1 and the amount doubles every day. How many litres on day 6?",a:64}},c:[9,9,4],ms:["Used a × r^(n − 1)","Kept tripling","Guessed"],o:[["Meera","Used a × r^(n − 1)","3 × 3⁴ = 3 × 81 = 243."],["Kabir","Kept tripling","3, 9, 27, 81, 243."],["Aarav","Guessed","Guessed 15 by adding 3 each day, then saw it triples."]]},
{t:"The savings race",lv:"DECIDE",w:"THE BANKER",s:"Two accounts are racing. Account A starts with 100 coins in month 1 and gains 100 every month. Account B starts with just 1 coin and doubles every month. I need to know in which month B first holds more than A.",tw:"SPLIT: one player tracks account A and another tracks account B, and they compare each month.",m:{p:"A has 100 coins in month 1 and gains 100 each month. B has 1 coin in month 1 and doubles each month. In which month does B first hold more than A?",a:12,h:"Make a table of both accounts month by month. Do not stop too early: B starts very small."},c:[8,9,4],ms:["Made a table of both accounts","Used both formulas","Guessed"],o:[["Riya","Made a table of both accounts","A: 100, 200, … 1200. B: 1, 2, 4, … 2048. B passes A in month 12."],["Kabir","Used both formulas","A is 100n and B is 2^(n−1). At n = 11, 1100 vs 1024. At n = 12, 1200 vs 2048."],["Aarav","Guessed","Guessed month 6, then found B was only 32 and kept going."]]},
{t:"The poet's doubling verse",lv:"USE",w:"THE POET",s:"My verse has a rule: line 1 has 3 syllables, and every next line doubles the last and adds 1. The verse has 5 lines and I forgot the last one. How many syllables does line 5 have?",tw:"SPLIT: each player works out one line and hands the number to the next player.",tm:"Applied the rule line by line",m:{p:"Line 1 has 3 syllables. Each next line doubles the last line and adds 1. How many syllables are in line 5?",a:63,h:"Work out line 2 from line 1, then line 3 from line 2, and keep going."},t2:{c:"A recursive rule gives each term from the one before it. You need the first term and the rule, then you build the sequence one step at a time.",f:"first term, then: next = rule applied to the previous term",e:"Start with 1. Rule: double the last term and add 2. Terms: 1, 4, 10, 22, …",q:{p:"Start with 5. Each next term is the last one minus 2, then doubled. What is the 3rd term?",a:8}},c:[9,6,5],ms:["Applied the rule line by line","Spotted the pattern in the answers","Guessed"],o:[["Riya","Applied the rule line by line","3, then 7, then 15, then 31, then 63."],["Kabir","Spotted the pattern in the answers","3, 7, 15, 31: each is one less than a power of 2, so line 5 is 64 − 1 = 63."],["Aarav","Guessed","Guessed 48, then applied the rule one line at a time."]]},
{t:"The poet's rhythms",lv:"TRY",fg:"rhythm",b:["THE POETS TENT","In the poets tent, verses are measured in beats. A short syllable takes 1 beat and a long one takes 2. The Poet says there is a hidden counting rule in how many different rhythms fit in a line, one that an old poet called Virahanka wrote down long ago."],w:"THE POET",s:"I am composing a line of exactly 5 beats from short syllables (1 beat) and long ones (2 beats). Here are the rhythms I found for 1, 2 and 3 beats. How many different rhythms can fill 5 beats?",tw:"SPLIT: each player lists rhythms ending in a short or a long syllable, and the team adds the lists.",tm:"Added the counts of the two shorter lines",m:{p:"A line of 5 beats uses short (1 beat) and long (2 beat) syllables. The figure shows the rhythms for 1, 2 and 3 beats. How many different rhythms fill 5 beats?",a:8,h:"A rhythm ends in either a short or a long syllable. Count how many rhythms come before each."},t2:{c:"A line of n beats ends in a short syllable, leaving a line of n − 1 beats, or in a long syllable, leaving a line of n − 2 beats. So you add the two earlier counts.",f:"ways(n) = ways(n − 1) + ways(n − 2)",e:"1 beat: 1 way. 2 beats: 2 ways. So 3 beats: 1 + 2 = 3 ways, and 4 beats: 2 + 3 = 5 ways.",q:{p:"How many different rhythms fill 6 beats?",a:13}},c:[7,9,4],ms:["Added the counts of the two shorter lines","Listed every rhythm","Guessed"],o:[["Meera","Added the counts of the two shorter lines","3 beats has 3 ways and 2 beats has 2, so 4 beats has 5. Then 3 + 5 = 8 for 5 beats."],["Kabir","Listed every rhythm","Wrote them all out and counted 8 rhythms."],["Aarav","Guessed","Guessed 6, then added the two before and got 8."]]},
{t:"The shell",lv:"ANALYSE",fg:"shell",b:["THE SHELL SHORE","On the shore, the Shell Collector arranges spiral shells. Each chamber of a shell is as large as the two before it added together, and the Poet's counting rule is hiding in every one."],w:"THE SHELL COLLECTOR",s:"The shell grows one chamber at a time, and each chamber is as big as the two before it put together: 1, 1, 2, 3, 5, 8 and so on. I must cut a case for the 10th chamber, so how big is it?",tw:"SPLIT: each player works out a few chambers and the team chains the results.",tm:"Added the last two each time",m:{p:"The chamber sizes are 1, 1, 2, 3, 5, 8 and so on, each the sum of the two before. What is the size of the 10th chamber?",a:55,h:"Keep adding the last two numbers: 13, 21, 34 and so on."},t2:{c:"This is the Virahanka–Fibonacci sequence. Every term from the third onwards is the sum of the two terms before it, starting from 1 and 1.",f:"F(n) = F(n − 1) + F(n − 2)<br>start with 1, 1",e:"1, 1, 2, 3, 5, 8, 13: the next term is 8 + 13 = 21.",q:{p:"The sequence is 1, 1, 2, 3, 5, 8 and so on. What is the 8th term?",a:21}},c:[10,4],ms:["Added the last two each time","Guessed"],o:[["Riya","Added the last two each time","13, 21, 34, 55. The 10th is 55."],["Aarav","Guessed","Guessed 50, then added the last two each time to get 55."]]},
{t:"Create: sequence puzzle",lv:"CREATE",w:"THE MASKED MINSTREL",s:"The song plays again, thanks to you. One last thing: write a beat of your own for the next hero. Choose a first term and a step, and leave a clue.",tw:"SWAP: trade beats and find each other's 10th term.",cg:{labs:["first term","step"],pf:"Make a pattern that starts at a number you choose and adds a step each time. The next hero must find its 10th term. Choose both numbers, add a clue and save.",make:function(v){return"A pattern starts at "+v[0]+" and adds "+v[1]+" each time. What is the 10th term?"}}}];
var UL9=[
{t:"Read the signposts",lv:"NOTICE",b:["THE SAND SEA","Beyond the last oasis the roads vanish into a sea of sand. Wooden signposts stand in the dunes, each carved with a claim. The dragon swapped many of them, and travellers who trusted a false one have never come back."],w:"THE NAVIGATOR",s:"The dragon swapped the signposts, and travellers follow whichever one they find. Before we can ask which ones lie, I must pick out the signs that make a claim we can check. Four stand before us. Which one can actually be true or false?",tw:"SPLIT: each player reads one signpost and decides if it can be checked, then the team compares.",tm:"Asked if it can be true or false",m:{p:"Which signpost makes a claim that can be checked as true or false? 1) Go north!   2) The oasis is 5 km away   3) Is the road safe?   4) What a beautiful dune. Type 1, 2, 3 or 4.",a:2,h:"A claim can be checked. An order, a question or an opinion cannot be true or false."},t2:{c:"A proposition is a statement that is either true or false. Orders, questions and opinions are not propositions.",f:"proposition = a statement that is true or false",e:"7 is a prime number is a proposition (it is true). Is 7 prime? is not, because it is a question.",q:{p:"Which of these is a proposition? 1) Close the door   2) Is 9 odd?   3) 9 is odd   4) How nice. Type 1, 2, 3 or 4.",a:3}},c:[11,8,3],ms:["Asked if it can be true or false","Crossed out orders, questions and opinions","Guessed"],o:[["Riya","Asked if it can be true or false","Only the oasis claim can be checked by measuring."],["Kabir","Crossed out orders, questions and opinions","Go north is an order, is the road safe is a question, and beautiful is an opinion."],["Aarav","Guessed","Picked the one with a number in it."]]},
{t:"The broken promise",lv:"UNDERSTAND",fg:"cases4",w:"THE NAVIGATOR",s:"A caravan leader promised: if a traveller carries water, then the traveller survives the crossing. Four travellers came back to the oasis. Only one of them shows that the promise was broken. Which one?",tw:"PLANTED ERROR: one player says the traveller with no water who survived breaks the promise. The team explains why not.",tm:"Looked for the if part true and the then part false",m:{p:"The promise: if a traveller carries water, then the traveller survives. Which traveller shows the promise was broken? 1) carried water and survived   2) carried water and did not survive   3) carried no water and survived   4) carried no water and did not survive. Type 1, 2, 3 or 4.",a:2,h:"A promise is broken only when the if part happens and the then part does not."},t2:{c:"An if-then statement is broken by exactly one kind of case: the if part is true but the then part is false. If the if part is false, the promise says nothing.",f:"if P then Q is broken only when P is true and Q is false",e:"If it rains, the road floods. A day with no rain and a flooded road does not break it. A rainy day with a dry road does.",q:{p:"The rule: if a number is divisible by 4 then it is even. Which number breaks the rule? 1) 8   2) 10   3) 12   4) none of them. Type 1, 2, 3 or 4.",a:4}},c:[9,8,4],ms:["Looked for the if part true and the then part false","Tried each traveller against the promise","Guessed"],o:[["Meera","Looked for the if part true and the then part false","Carried water but did not survive is the only one that goes against it."],["Kabir","Tried each traveller against the promise","The first one fits, the third and fourth never carried water so the promise says nothing, and the second goes against it."],["Aarav","Guessed","Picked the one that sounded most sad."]]},
{t:"Test the signpost",lv:"TRY",w:"THE SCOUT",s:"This signpost swears that 2n + 1 is a prime number for every whole number n. I have only five checks before the sand wind comes. Test it, and bring me a value of n that breaks the claim.",tw:"SPLIT: each player tests a different n and the team shares what they found.",m:{probe:{f:function(x){var v=2*x+1,q=true;for(var i=2;i*i<=v;i++)if(v%i===0)q=false;return v+(q?" is prime":" is NOT prime")},lab:"n",tries:5,out:"2n + 1",btn:"CHECK"},p:"Check up to 5 values of n for the claim that 2n + 1 is always prime. Then type a value of n that breaks the claim.",v:function(v){if(!(v>=1)||v%1!==0)return false;var w=2*v+1;for(var i=2;i*i<=w;i++)if(w%i===0)return true;return false},h:"Try n = 1, 2, 3, 4 and so on, and look for the first one where 2n + 1 is not prime."},c:[9,5],ms:["Tested values one after another","Tried odd values of 2n + 1 that are multiples of 3"],o:[["Riya","Tested values one after another","n = 1, 2 and 3 gave 3, 5 and 7. n = 4 gave 9, which is not prime."],["Kabir","Tried odd values of 2n + 1 that are multiples of 3","2n + 1 = 9 is a multiple of 3, so n = 4 breaks it."]]},
{t:"Is that proof?",lv:"UNDERSTAND",b:["THE TRICKSTERS TENT","In a striped tent a Trickster sells certainty by the kilo. He has tested each of his claims on a handful of cases and swears that is plenty."],w:"THE TRICKSTER",s:"My claim is that every animal in my caravan has a hump. I checked five camels and every one of them has a hump. Five out of five. That proves it, does it not?",tw:"PLANTED ERROR: one player backs the Trickster and says five examples are enough. The team asks what one animal with no hump would do.",tm:"Knew examples cannot prove a claim for all cases",m:{p:"The Trickster checked five camels and found a hump on every one. Does that prove that every animal in his caravan has a hump? 1) Yes, five examples prove it   2) No, one animal without a hump would break it. Type 1 or 2.",a:2,h:"Could one more animal in the caravan have no hump?"},t2:{c:"Examples can show that a claim might be true, but they cannot prove it for every case. One counterexample, a single case that breaks the claim, is enough to show it is false.",f:"many examples do not prove a claim<br>one counterexample disproves it",e:"Claim: all prime numbers are odd. The primes 3, 5 and 7 fit, but 2 is a counterexample, so the claim is false.",q:{p:"A claim works for 100 different numbers. Must it be true for every number? 1) Yes   2) No. Type 1 or 2.",a:2}},c:[10,6,3],ms:["Knew examples cannot prove a claim for all cases","Looked for an animal that might break it","Guessed"],o:[["Riya","Knew examples cannot prove a claim for all cases","Five camels tell you about five camels, not about the whole caravan."],["Kabir","Looked for an animal that might break it","What about a goat or a horse? One without a hump would disprove it."],["Aarav","Guessed","Said yes because five is a lot, then thought about the sixth animal."]]},
{t:"Counterexample hunt",lv:"USE",w:"THE SCOUT",s:"A traveller told the dunes that every number divisible by 3 is also divisible by 6. I do not believe him. Bring me one number that breaks his claim.",tw:"SPLIT: each player tries different multiples of 3 and the team shares what they find.",m:{p:"Claim: every number divisible by 3 is also divisible by 6. Type a number that breaks the claim.",v:function(v){return v>0&&v%1===0&&v%3===0&&v%6!==0},h:"You need a number that 3 divides into but 6 does not. Try odd multiples of 3."},c:[10,6],ms:["Tried multiples of 3 until one failed","Chose an odd multiple of 3"],o:[["Meera","Tried multiples of 3 until one failed","3 is not divisible by 6, so 3 breaks the claim."],["Kabir","Chose an odd multiple of 3","Any odd multiple of 3, like 9, is not divisible by 2, so not by 6."]]},
{t:"Flip the signpost",lv:"UNDERSTAND",fg:"arrow",b:["THE ECHO CANYON","In Echo Canyon everything comes back reversed. The Navigator says every signpost has an echo, the same sentence with its two halves swapped, and the echo is not always honest."],w:"THE NAVIGATOR",s:"Every signpost here has an echo that says the same thing the other way round. The sign reads: if a number is divisible by 6, then it is divisible by 3. Which sign is its echo?",tw:"SPLIT: each player writes the echo of a different sign and the team checks them.",tm:"Swapped the two parts",m:{p:"The sign says: if a number is divisible by 6, then it is divisible by 3. Which sign is its echo, the converse? 1) if a number is divisible by 3, then it is divisible by 6   2) if a number is not divisible by 6, then it is not divisible by 3   3) if a number is divisible by 6, then it is not divisible by 3   4) if a number is divisible by 2, then it is divisible by 6. Type 1, 2, 3 or 4.",a:1,h:"The echo swaps the two parts of the sign. What was the if part, and what was the then part?"},t2:{c:"The converse of if P then Q is if Q then P: the two parts swap places. A statement and its converse are different statements.",f:"statement: if P then Q<br>converse: if Q then P",e:"If a shape is a square, then it has four sides. Converse: if a shape has four sides, then it is a square.",q:{p:"What is the converse of: if a number ends in 0, then it is divisible by 10? 1) if a number is divisible by 10, then it ends in 0   2) if a number does not end in 0, then it is not divisible by 10   3) if a number ends in 0, then it is not divisible by 10   4) if a number is divisible by 5, then it ends in 0. Type 1, 2, 3 or 4.",a:1}},c:[9,8,3],ms:["Swapped the two parts","Reversed the signpost's direction","Guessed"],o:[["Riya","Swapped the two parts","Divisible by 6 and divisible by 3 swap places."],["Kabir","Reversed the signpost's direction","The sign goes from 6 to 3, so the echo goes from 3 to 6."],["Aarav","Guessed","Picked the one that looked most like the sign."]]},
{t:"Is the echo honest?",lv:"ANALYSE",w:"THE SCOUT",s:"The first sign is true: divisible by 6 means divisible by 3. Its echo points the other way. If I trust the echo and it lies, I walk into the dunes. Is the echo true or false?",tw:"PLANTED ERROR: one player says the echo must be true because the sign is true. The team hunts for a counterexample.",tm:"Found a counterexample",m:{p:"Is this echo true or false? If a number is divisible by 3, then it is divisible by 6. 1) true   2) false. Type 1 or 2.",a:2,h:"Try a number divisible by 3, like 9, and check whether 6 divides it."},t2:{c:"A statement can be true while its converse is false. To show a converse is false you only need one counterexample: a case where the new if part holds but the then part fails.",f:"a true statement can have a false converse<br>one counterexample disproves the converse",e:"If a number is divisible by 4, then it is even. Converse: if a number is even, then it is divisible by 4. The number 6 is a counterexample.",q:{p:"The converse is: if a number is a multiple of 5, then it ends in 0. Is it true or false? 1) true   2) false. Type 1 or 2.",a:2}},c:[9,7,4],ms:["Found a counterexample","Reasoned that 6 also needs a factor of 2","Guessed"],o:[["Meera","Found a counterexample","9 is divisible by 3 but not by 6, so the echo is false."],["Kabir","Reasoned that 6 also needs a factor of 2","Divisible by 3 is not enough, because 6 needs a 2 as well."],["Aarav","Guessed","Said true, then tried 9 and changed my mind."]]},
{t:"Both ways",lv:"ANALYSE",w:"THE CARAVAN LEADER",s:"I follow only signposts that work both ways: the sign and its echo must both be true. Four statements are carved on my map. Which one passes my test?",tw:"SPLIT: each player tests the echo of one statement and the team votes.",tm:"Tested the echo of each",m:{p:"Which statement is true and also has a true converse? 1) if a number is divisible by 4, then it is even   2) if a triangle has three equal sides, then it has three equal angles   3) if a shape is a square, then it is a rectangle   4) if a number is prime, then it is odd. Type 1, 2, 3 or 4.",a:2,h:"Check each statement, then check its converse. Find a case that breaks the echo."},t2:{c:"When a statement and its converse are both true, we say P if and only if Q. It means P and Q always go together.",f:"P if and only if Q means both:<br>if P then Q, and if Q then P",e:"A number is even if and only if it is divisible by 2. Both directions are true.",q:{p:"Which is an if-and-only-if statement? 1) a number is even if and only if it is divisible by 2   2) a number is odd if and only if it is prime   3) a number is divisible by 4 if and only if it is even   4) a shape is a rectangle if and only if it is a square. Type 1, 2, 3 or 4.",a:1}},c:[7,9,4],ms:["Tested the echo of each","Looked for a counterexample to each","Guessed"],o:[["Riya","Tested the echo of each","Divisible by 4 gives even but even does not give divisible by 4. A square is a rectangle but not the reverse. Only the triangle works both ways."],["Kabir","Looked for a counterexample to each","6 breaks the first echo, a plain rectangle breaks the third, and 2 breaks the fourth."],["Aarav","Guessed","Picked the triangle because it looked like a definition."]]},
{t:"Why it always works",lv:"USE",fg:"pairs",b:["THE SANDS PROOF","Deep in the dunes a stone tablet is carved with a claim and a blank space for the reasoning. The Sage says an example only shows what happened once, but a reason shows what must always happen."],w:"THE SAND SAGE",s:"This tablet says that the sum of any two even numbers is even. I do not want more examples. I want a reason that works for every pair. Which reason would convince a sceptic?",tw:"PLANTED ERROR: one player says five pairs of numbers prove it. The team explains why that is not enough.",tm:"Chose the reasoning that covers every case",m:{p:"Which reason proves that the sum of any two even numbers is even? 1) 2 + 4 = 6 and 6 + 8 = 14, both even   2) any even numbers are 2a and 2b, and 2a + 2b = 2(a + b), which is even   3) even numbers are very common   4) it worked for 100 pairs I tried. Type 1, 2, 3 or 4.",a:2,h:"A proof must cover every pair, not just the ones you tried. What can describe any even number?"},t2:{c:"A proof must work for every case, so it uses letters instead of particular numbers. An even number can always be written as 2 times a whole number.",f:"an even number = 2a<br>2a + 2b = 2(a + b)",e:"Why is the sum of two odd numbers even? Write them as 2a + 1 and 2b + 1. Their sum is 2a + 2b + 2 = 2(a + b + 1), which is even.",q:{p:"Which reason proves that an even number times any whole number is even? 1) 2 × 5 = 10 and 4 × 3 = 12   2) an even number is 2a, so 2a × b = 2(ab), which is even   3) it worked for 50 pairs   4) all products are even. Type 1, 2, 3 or 4.",a:2}},c:[8,10,4],ms:["Chose the reasoning that covers every case","Rejected the options with only examples","Guessed"],o:[["Meera","Chose the reasoning that covers every case","2a + 2b = 2(a + b) works for any a and b."],["Kabir","Rejected the options with only examples","Options 1, 3 and 4 only show cases or opinions. Only 2 is a general reason."],["Aarav","Guessed","Picked the one with the most letters."]]},
{t:"Catch the liar",lv:"DECIDE",w:"THE SCOUT",s:"Four travellers each shout a claim, and exactly one of them is lying. If I follow the liar's road I am lost in the dunes. Which claim is false?",tw:"SPLIT: each player checks one claim, and the team votes on the liar. The hero makes the final call.",tm:"Found a counterexample",m:{p:"Which claim is false? 1) the sum of two odd numbers is even   2) the product of two odd numbers is odd   3) the sum of two primes is even   4) the product of two even numbers is even. Type 1, 2, 3 or 4.",a:3,h:"A false claim needs only one counterexample. Try small primes, like 2 and 3."},t2:{c:"To decide whether a claim is false, hunt for one case that breaks it. Try small and unusual numbers first, like 0, 1 or 2.",f:"one counterexample is enough to disprove a claim",e:"Claim: all prime numbers are odd. The prime 2 is even, so the claim is false.",q:{p:"Which claim is false? 1) every multiple of 6 is even   2) every prime is odd   3) the sum of two evens is even   4) every multiple of 4 is a multiple of 2. Type 1, 2, 3 or 4.",a:2}},c:[8,10,4],ms:["Found a counterexample","Tested each claim with small numbers","Guessed"],o:[["Riya","Found a counterexample","2 + 3 = 5 is the sum of two primes and is odd, so claim 3 is false."],["Kabir","Tested each claim with small numbers","3 + 5 = 8, 3 × 5 = 15, 2 × 4 = 8 all fit. Only 2 + 3 = 5 breaks one."],["Aarav","Guessed","Guessed claim 2, then tried 3 × 5 = 15 and saw it was odd."]]},
{t:"Create: signpost",lv:"CREATE",w:"THE SAND SAGE",s:"The sand has parted, thanks to you. One last thing: carve a signpost of your own for the next hero, a claim about divisibility that they must test.",tw:"SWAP: trade signposts and decide whether each is true or false.",cg:{labs:["divisor 1","divisor 2"],pf:"Make a signpost: If a number is divisible by your first number, then it is divisible by your second. Choose both numbers (whole numbers from 1 to 20), add a clue and save.",ok:function(v){return v[0]>=1&&v[1]>=1&&v[0]<=20&&v[1]<=20&&v[0]%1===0&&v[1]%1===0},hint:"Use whole numbers from 1 to 20.",make:function(v){return"Signpost: if a number is divisible by "+v[0]+", then it is divisible by "+v[1]+". Is it true or false? Find a counterexample or explain why."}}}];
var UL10=[
{t:"Read the chart",lv:"NOTICE",fg:"bc",b:["THE GREAT ARCHIVE","Rows of ledgers climb to the ceiling of the Great Archive, and every one is smudged with dragon ash. The Archivist says the charts survived better than the tables, if you know how to read them."],w:"THE ARCHIVIST",s:"The harvest chart survived the ash: sacks of wheat, rice and maize from the royal farms. The queen wants to plant more of whichever grain was harvested most. Which one is it?",tw:"SPLIT: each player reads one bar and the team compares.",m:{p:"Which grain was harvested the most? 1) wheat   2) rice   3) maize. Type 1, 2 or 3.",a:2,h:"Compare how tall the bars are."},c:[12,3],ms:["Compared the bars","Read the numbers on the bars"],o:[["Riya","Compared the bars","The rice bar is the tallest."],["Kabir","Read the numbers on the bars","Rice has 20, wheat 12 and maize 8."]]},
{t:"Add the bars",lv:"UNDERSTAND",fg:"bc",w:"THE ARCHIVIST",s:"The granary master needs the total number of sacks in the chart so he can hire enough carts. Add them all up.",tw:"SPLIT: each player adds two bars and the team combines.",m:{p:"Add all three bars of the harvest chart. How many sacks in total?",a:40,h:"Read each bar's number and add them."},c:[12,4],ms:["Read each bar and added","Added two bars then the third"],o:[["Meera","Read each bar and added","12 + 20 + 8 = 40."],["Kabir","Added two bars then the third","12 + 20 = 32, then 32 + 8 = 40."]]},
{t:"The mean",lv:"UNDERSTAND",w:"THE TEACHER",s:"The Bear sets four exams, and a student scored 60, 70, 80 and 90. The Bear wants one number to describe how the student did overall. What is the average, the mean?",tw:"PLANTED ERROR: one player adds the scores and forgets to divide. The team catches it.",tm:"Added and divided by how many",m:{p:"A student scored 60, 70, 80 and 90. What is the mean score?",a:75,h:"Add the scores, then share the total equally among the exams."},t2:{c:"The mean is the total of all the values divided by how many values there are. It is what each value would be if everything were shared equally.",f:"mean = total / number of values",e:"Scores 4, 6 and 8: total 18 shared among 3 scores gives a mean of 6.",q:{p:"Scores are 50, 70, 90 and 70. What is the mean?",a:70}},c:[11,5,3],ms:["Added and divided by how many","Found the middle of the scores","Guessed"],o:[["Riya","Added and divided by how many","60 + 70 + 80 + 90 = 300, and 300 ÷ 4 = 75."],["Kabir","Found the middle of the scores","70 and 80 are the middle two, halfway between is 75."]]},
{t:"The average trap",lv:"UNDERSTAND",w:"THE TEACHER",s:"Class A has 10 students averaging 80. Class B has 30 students averaging 60. The principal says the whole school's average is (80 + 60) / 2 = 70, and wants it printed on the certificate. Is she right?",tw:"PLANTED ERROR: one player backs the principal. The team asks which class has more students.",tm:"Saw that the bigger class counts more",m:{p:"Class A (10 students) averages 80 and class B (30 students) averages 60. The principal says the combined average is 70. Is she right? 1) Yes, 70 is exactly in the middle   2) No, the bigger class counts for more. Type 1 or 2.",a:2,h:"Does every class count equally, or does every student count equally?"},t2:{c:"When groups have different sizes you cannot just average their averages. Every student counts once, so a bigger group pulls the overall average closer to its own average.",f:"overall average = total of all scores / total number of students",e:"Class P has 2 students averaging 10. Class Q has 8 students averaging 20. The overall average is (20 + 160) / 10 = 18, close to Q's 20.",q:{p:"Group X has 1 person averaging 100. Group Y has 9 people averaging 0. Is the overall average 50? 1) Yes   2) No. Type 1 or 2.",a:2}},c:[9,8,3],ms:["Saw that the bigger class counts more","Worked out the real total","Guessed"],o:[["Meera","Saw that the bigger class counts more","30 students are at 60 and only 10 at 80, so it must be closer to 60."],["Kabir","Worked out the real total","800 + 1800 = 2600 over 40 students is 65, not 70."]]},
{t:"Merge the classes",lv:"TRY",w:"THE ARCHIVIST",s:"The two classes are being merged. Class A has 10 students averaging 80, and class B averages 60. Feed my machine a size for class B and it tells you the combined average. Predict the average when class B has 30 students.",tw:"SPLIT: each player tries one size for class B and the team shares the results before predicting.",tm:"Used the total of all scores",m:{probe:{f:function(x){return Math.round((800+60*x)/(10+x)*10)/10},lab:"students in B",tries:3,out:"combined average",btn:"MERGE",block:30},p:"Try up to 3 sizes for class B and watch the combined average. Then predict it when class B has 30 students.",a:65,h:"Watch which way the average moves as class B gets bigger. Where does it settle?"},t2:{c:"Add up all the scores in both classes, then divide by the total number of students. This is the weighted average.",f:"combined average = (n<sub>1</sub> × avg<sub>1</sub> + n<sub>2</sub> × avg<sub>2</sub>) / (n<sub>1</sub> + n<sub>2</sub>)",e:"5 students at 90 and 15 students at 50: (450 + 750) / 20 = 60.",q:{p:"Class P has 20 students averaging 70. Class Q has 30 students averaging 90. What is the combined average?",a:82}},c:[8,9,4],ms:["Used the total of all scores","Watched how the average moved","Guessed"],o:[["Riya","Used the total of all scores","800 + 30 × 60 = 2600, and 2600 ÷ 40 = 65."],["Kabir","Watched how the average moved","10 gave 70, 20 gave about 66.7, so 30 should be near 65."]]},
{t:"Mixing the tea",lv:"USE",w:"THE MERCHANT",s:"I mixed two sacks of tea: 4 kg that cost 50 coins per kg and 6 kg that cost 80 coins per kg. What must I charge per kg for the mix so I do not lose money?",tw:"SPLIT: one player finds the total cost and another the total weight.",m:{p:"4 kg of tea at 50 coins per kg is mixed with 6 kg at 80 coins per kg. What should the mix cost per kg?",a:68,h:"Find the total cost first, then divide by the total weight."},c:[9,6],ms:["Divided the total cost by the total weight","Used the weighted average formula"],o:[["Meera","Divided the total cost by the total weight","200 + 480 = 680 coins for 10 kg, so 68 per kg."],["Kabir","Used the weighted average formula","(4 × 50 + 6 × 80) / 10 = 68."]]},
{t:"The missing mark",lv:"ANALYSE",w:"THE TEACHER",s:"A student's mean over five exams is 72, but the fifth paper is lost. The other four marks are 70, 65, 80 and 75. What was the fifth mark?",tw:"SPLIT: one player finds the total from the mean and another adds the known marks.",tm:"Worked out the total from the mean",m:{p:"The mean of five marks is 72. Four of the marks are 70, 65, 80 and 75. What is the fifth mark?",a:70,h:"Work out what the total of all five must be, then take away the four you know."},t2:{c:"A mean tells you the total: mean times the number of values. Subtract the values you know to find the missing one.",f:"total = mean × number of values",e:"The mean of 4 numbers is 10 and three of them are 8, 9 and 12. The total is 40, the known ones add to 29, so the fourth is 11.",q:{p:"The mean of 4 numbers is 15. Three of them are 10, 20 and 12. What is the fourth?",a:18}},c:[8,7,4],ms:["Worked out the total from the mean","Tried marks until the mean was 72","Guessed"],o:[["Riya","Worked out the total from the mean","72 × 5 = 360, the known marks add to 290, so 70."],["Kabir","Tried marks until the mean was 72","Tried 60 (mean 70) then 70 (mean 72)."]]},
{t:"Stacked bars",lv:"UNDERSTAND",fg:"stack",w:"THE ARCHIVIST",s:"Two farms recorded their apples in stacked bars, with red at the bottom and green on top. The queen wants to know how many red apples the two farms have together.",tw:"SPLIT: each player reads one farm's bar and the team adds.",m:{p:"Farm A has 8 red and 5 green apples. Farm B has 6 red and 9 green. How many red apples are there in total?",a:14,h:"Read only the red part of each bar."},c:[10,4],ms:["Read the red part of each bar","Added all the apples then took away the green ones"],o:[["Meera","Read the red part of each bar","8 + 6 = 14."],["Kabir","Added all the apples then took away the green ones","13 + 15 = 28, minus 5 + 9 = 14, leaves 14."]]},
